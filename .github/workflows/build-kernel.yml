name: Build linux-avalos

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Version del kernel (vacio = ultima estable)"
        required: false
        default: ""
      force_rebuild:
        description: "Forzar rebuild"
        type: boolean
        default: false
      build_bore:
        description: "Construir linux-avalos-bore (BORE scheduler)"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"

env:
  AVALOS_REPO: jeffreysama/avalos
  REPO_TAG: repo
  MARCH: x86-64-v3
  MARCH_COMPAT: x86-64-v2
  PKGBUILD_DIR: pkgs/linux-avalos
  FALLBACK_KERNEL_VER: "7.1.8"

jobs:
  check-version:
    name: Verificar version del kernel
    runs-on: ubuntu-latest
    outputs:
      kernel_ver: ${{ steps.get_ver.outputs.kernel_ver }}
      should_build: ${{ steps.check_build.outputs.should_build }}
    steps:
      - name: Obtener ultima version estable
        id: get_ver
        run: |
          if [[ -n "${{ github.event.inputs.kernel_version }}" ]]; then
            KERNEL_VER="${{ github.event.inputs.kernel_version }}"
            echo "Version especificada manualmente: $KERNEL_VER"
          else
            KERNEL_VER=""

            # Primario: releases.json trae un campo latest_stable.version dedicado —
            # no depende de adivinar el orden del array "releases" (mainline va primero
            # ahí, y un head -1 sobre versiones X.Y.Z puede agarrar la rama equivocada).
            KERNEL_VER=$(curl -fsSL --max-time 15 https://www.kernel.org/releases.json 2>/dev/null \
              | jq -r '.latest_stable.version // empty' 2>/dev/null || true)

            if [[ -z "$KERNEL_VER" ]]; then
              echo "releases.json fallo (o sin jq), intentando finger_banner..."
              # FIX: el formato real de finger_banner es texto natural
              # ("The latest stable version of the Linux kernel is: X.Y.Z"),
              # nunca ha tenido "stable:" con dos puntos — ese patrón no
              # coincidía nunca y este método siempre fallaba en silencio.
              KERNEL_VER=$(curl -fsSL --max-time 15 https://www.kernel.org/finger_banner 2>/dev/null \
                | grep -oP 'latest stable version of the Linux kernel is:\s*\K[0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 || true)
            fi

            if [[ -z "$KERNEL_VER" ]]; then
              echo "Todas las fuentes fallaron, usando version de fallback: ${{ env.FALLBACK_KERNEL_VER }}"
              KERNEL_VER="${{ env.FALLBACK_KERNEL_VER }}"
            fi

            echo "Version detectada: $KERNEL_VER"
          fi

          echo "kernel_ver=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "Version final: $KERNEL_VER"

      - name: Revisar si ya esta construida
        id: check_build
        run: |
          KERNEL_VER="${{ steps.get_ver.outputs.kernel_ver }}"
          FORCE="${{ github.event.inputs.force_rebuild }}"

          if [[ "$FORCE" == "true" ]]; then
            echo "Rebuild forzado"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # FIX (16-ago): el pre-check de "ya publicado" de abajo es correcto
          # para el cron semanal — ahí el único propósito es no recompilar si
          # kernel.org no publicó nada nuevo esa semana. Pero compara solo
          # KERNEL_VER, no pkgrel: si alguien edita PKGBUILD/gen-config.sh
          # sin que la versión del kernel cambie (exactamente lo que hicimos
          # hoy), este mismo pre-check encontraría el asset
          # "linux-avalos-${KERNEL_VER}" del build anterior y saltaría el
          # build entero — obligando a acordarse de tildar "force_rebuild" a
          # mano cada vez que se toca el código fuente sin bump de versión.
          # Un disparo manual (workflow_dispatch) ya es, de por sí, una señal
          # explícita de "quiero que esto corra ahora"; no tiene sentido que
          # también dependa de este pre-check pensado para el cron.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Disparo manual (workflow_dispatch) - se compila sin mirar si ya esta publicada"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING=$(gh release view "${{ env.REPO_TAG }}" \
            --repo "${{ env.AVALOS_REPO }}" \
            --json assets \
            --jq ".assets[].name" 2>/dev/null \
            | grep "linux-avalos-${KERNEL_VER}" || true)

          if [[ -n "$EXISTING" ]]; then
            echo "La version $KERNEL_VER ya esta publicada - omitiendo build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "La version $KERNEL_VER no esta publicada - iniciando build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kernel:
    name: Compilar linux-avalos
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bore_result: ${{ steps.build_bore.outcome }}
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Instalar dependencias de build
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl wget \
            bc bison flex python \
            clang llvm lld \
            pahole cpio perl tar xz zstd libelf \
            github-cli

      - name: Checkout del repo
        uses: actions/checkout@v7

      - name: Crear usuario builder
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Actualizar pkgver en PKGBUILD
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          PKGBUILD_FILE="${{ env.PKGBUILD_DIR }}/PKGBUILD"

          # FIX: este step antes SIEMPRE reseteaba pkgrel=1, sin importar si
          # pkgver realmente cambio. Resultado real (15-ago): cuando se
          # arreglo el .config del kernel (symlink 'build', luego
          # overlay/dm_snapshot/crypto_lz4, luego gen-config.sh) SIN que
          # cambiara la version de Linux upstream (7.1.8 seguia siendo
          # 7.1.8), el paquete republicado quedo con el string de version
          # IDENTICO al build roto anterior (7.1.8-1) — pacman -Syu no
          # detecto ninguna actualizacion disponible, y hubo que forzar con
          # 'pacman -S linux-avalos' a mano en la laptop del cliente. Con
          # este fix: si pkgver NO cambio respecto al valor actual en el
          # archivo, se incrementa pkgrel en vez de resetearlo — asi
          # cualquier fix al PKGBUILD (sin bump de kernel) es detectable
          # como actualizacion real. Si pkgver SI cambio (nueva version de
          # Linux), se resetea pkgrel=1 como es la convencion estandar.
          CURRENT_VER=$(grep '^pkgver=' "$PKGBUILD_FILE" | cut -d= -f2)
          CURRENT_REL=$(grep '^pkgrel=' "$PKGBUILD_FILE" | cut -d= -f2)

          if [[ "$CURRENT_VER" == "$KERNEL_VER" ]]; then
            NEW_REL=$(( CURRENT_REL + 1 ))
            echo "pkgver sin cambios (${KERNEL_VER}) — incrementando pkgrel: ${CURRENT_REL} -> ${NEW_REL}"
          else
            NEW_REL=1
            echo "pkgver cambio (${CURRENT_VER} -> ${KERNEL_VER}) — reseteando pkgrel a 1"
          fi

          sed -i "s|^pkgver=.*|pkgver=${KERNEL_VER}|" "$PKGBUILD_FILE"
          sed -i "s|^pkgrel=.*|pkgrel=${NEW_REL}|" "$PKGBUILD_FILE"
          echo "PKGBUILD actualizado:"
          grep -E "^pkg(ver|rel)" "$PKGBUILD_FILE"

      - name: Generar config base del kernel
        run: |
          if [[ ! -f "${{ env.PKGBUILD_DIR }}/gen-config.sh" ]]; then
            echo "Error: gen-config.sh no encontrado en ${{ env.PKGBUILD_DIR }}"
            exit 1
          fi
          if [[ ! -x "${{ env.PKGBUILD_DIR }}/gen-config.sh" ]]; then
            echo "gen-config.sh existe pero no tiene permiso de ejecución — añadiendo..."
            chmod +x "${{ env.PKGBUILD_DIR }}/gen-config.sh"
          fi
          chown -R builder:builder ${{ env.PKGBUILD_DIR }}
          sudo -u builder bash ${{ env.PKGBUILD_DIR }}/gen-config.sh

      - name: Compilar linux-avalos
        run: |
          chown -R builder:builder ${{ env.PKGBUILD_DIR }}
          JOBS=$(nproc)
          sudo -u builder env \
            JOBS="$JOBS" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=${{ env.MARCH }} -mtune=generic" \
            bash -c '
              set -euo pipefail
              cd '"${{ env.PKGBUILD_DIR }}"'
              MAKEFLAGS="-j${JOBS}" \
              makepkg -s --noconfirm --needed --skippgpcheck
            '

      - name: Sincronizar pkgver con el repo
        # FIX: el PKGBUILD del repo quedaba desactualizado (siempre mostraba
        # la version con la que se creo el archivo la primera vez) porque el
        # 'sed' de "Actualizar pkgver en PKGBUILD" solo tocaba la copia local
        # del runner — nunca se commiteaba de vuelta.
        #
        # FIX-2 (post-mortem run #41): el intento anterior de este step usaba
        # 'cd "$GITHUB_WORKSPACE"' + 'git diff' a secas y murio con "fatal:
        # not in a git directory" (exit 128), bloqueando TODO el resto del
        # job (bore, compat, firma GPG, publicacion) durante 36 minutos de
        # compute perdido. Causa exacta no confirmada (posible mismatch de
        # working dir dentro del contenedor archlinux:base-devel, o issue de
        # ownership tras el 'chown -R builder:builder' del step anterior).
        # En vez de perseguir la causa exacta bajo presion, este step ahora:
        #   1. Usa 'git -C' explicito en vez de 'cd' (no depende del cwd real
        #      del shell del step).
        #   2. Registra 'safe.directory' por si el bug real era el chown de
        #      ownership (git rechaza operar en dirs que no son del usuario
        #      actual salvo que se marquen como seguras explicitamente).
        #   3. Si aun asi $GITHUB_WORKSPACE no resulta ser un repo git valido,
        #      imprime diagnostico (pwd, ls) y sale limpio en vez de fallar.
        #   4. continue-on-error: true — este paso es "nice to have" (deja el
        #      repo prolijo), NUNCA debe poder bloquear bore/compat/firma/
        #      publicacion, que es lo que realmente importa entregar.
        if: success()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          if [[ ! -d "$GITHUB_WORKSPACE/.git" ]]; then
            echo "::warning::GITHUB_WORKSPACE no es un repo git valido, se omite el commit del bump de version"
            echo "--- diagnostico ---"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            pwd
            ls -la "$GITHUB_WORKSPACE" 2>&1 | head -20
            exit 0
          fi

          if git -C "$GITHUB_WORKSPACE" diff --quiet -- "${{ env.PKGBUILD_DIR }}/PKGBUILD"; then
            echo "PKGBUILD ya estaba en la version correcta — nada que commitear"
          else
            git -C "$GITHUB_WORKSPACE" config user.name "avalos-bot"
            git -C "$GITHUB_WORKSPACE" config user.email "actions@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" add "${{ env.PKGBUILD_DIR }}/PKGBUILD"
            git -C "$GITHUB_WORKSPACE" commit -m "chore(kernel): bump linux-avalos a ${{ needs.check-version.outputs.kernel_ver }}"
            git -C "$GITHUB_WORKSPACE" push \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.AVALOS_REPO }}.git" \
              "HEAD:${{ github.ref_name }}"
            echo "PKGBUILD actualizado y commiteado (${{ needs.check-version.outputs.kernel_ver }})"
          fi

      - name: Compilar linux-avalos-bore
        id: build_bore
        # FIX: sin esto, si el parche BORE no aplica limpio contra el
        # point-release exacto del kernel (CachyOS actualiza su carpeta
        # major.minor con cierto retraso tras cada release de kernel.org —
        # no es instantáneo), este step fallaba y GitHub Actions saltaba
        # TODOS los pasos siguientes por default: compat NUNCA se
        # compilaba, y nada se publicaba en Releases — ni siquiera
        # linux-avalos estándar, que sí había compilado bien.
        # continue-on-error deja que el resto del pipeline siga cuando
        # BORE específicamente falla, sin ocultar el problema (ver el
        # step "Resumen" al final, que ahora sí lo reporta).
        continue-on-error: true
        if: github.event.inputs.build_bore != 'false' || github.event_name == 'schedule'
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          MAJOR="${KERNEL_VER%%.*}"
          MINOR="${KERNEL_VER#*.}"; MINOR="${MINOR%.*}"
          JOBS=$(nproc)

          # FIX (16-ago): 'makepkg -s' guarda src/ y pkg/ como subcarpetas del
          # propio directorio del PKGBUILD (no hay SRCDEST/PKGDEST custom
          # aquí). Para cuando llegamos aquí, "linux-avalos" ya corrió su
          # 'makepkg -s' completo, así que PKGBUILD_DIR/src/linux-${KERNEL_VER}
          # tiene el kernel YA COMPILADO (miles de .o, vmlinux, ThinLTO, etc.)
          # sin el parche BORE. Sin este 'rm -rf', el 'cp -r' de abajo
          # duplicaba ese árbol entero dentro de BORE_DIR — ningún
          # 'makepkg -s' de aquí abajo pasa --noextract, así que sí se
          # re-extrae el tarball limpio encima, pero tar sobrescribe
          # archivos, no borra los que sobran: los .o/.cmd viejos se quedan.
          # El tracking de kbuild (basado en hash de comando, no solo mtime)
          # probablemente salva la corrección del build, pero no salva el
          # espacio en disco — con runners de ~14GB libres y un árbol de
          # kernel con ThinLTO duplicado dos veces (bore + compat), es la
          # misma clase de bug que ya mordió una vez con /tmp en WSL, solo
          # que en otro lugar. Empezar cada variante desde una copia limpia
          # (solo PKGBUILD, config, install, patches) es más barato y más
          # confiable que arrastrar el build anterior.
          rm -rf "${{ env.PKGBUILD_DIR }}/src" "${{ env.PKGBUILD_DIR }}/pkg"

          BORE_DIR="${{ env.PKGBUILD_DIR }}-bore"
          cp -r "${{ env.PKGBUILD_DIR }}" "$BORE_DIR"
          chown -R builder:builder "$BORE_DIR"

          sed -i 's|^pkgbase=linux-avalos$|pkgbase=linux-avalos-bore|' "$BORE_DIR/PKGBUILD"
          sed -i 's|pkgname=(linux-avalos linux-avalos-headers)|pkgname=(linux-avalos-bore linux-avalos-bore-headers)|' "$BORE_DIR/PKGBUILD"

          sed -i 's|^package_linux-avalos-headers()|package_linux-avalos-bore-headers()|' "$BORE_DIR/PKGBUILD"
          sed -i 's|^package_linux-avalos()|package_linux-avalos-bore()|' "$BORE_DIR/PKGBUILD"

          sed -i 's|conflicts=(\"linux-avalos-compat\" \"linux-avalos-compat-headers\" \"linux-avalos-bore\" \"linux-avalos-bore-headers\")|conflicts=(\"linux-avalos\" \"linux-avalos-headers\" \"linux-avalos-compat\" \"linux-avalos-compat-headers\")|' "$BORE_DIR/PKGBUILD"

          cp "$BORE_DIR/linux-avalos.install" "$BORE_DIR/linux-avalos-bore.install"
          sed -i 's|linux-avalos|linux-avalos-bore|g' "$BORE_DIR/linux-avalos-bore.install"
          rm -f "$BORE_DIR/linux-avalos.install"
          sed -i 's|^install=linux-avalos\.install$|install=linux-avalos-bore.install|' "$BORE_DIR/PKGBUILD"

          # Cosmetico: sin esto, 'pacman -Si linux-avalos-bore' mostraba el
          # mismo pkgdesc que el estandar, palabra por palabra — no se podía
          # distinguir uno de otro por descripción.
          sed -i 's|x86-64-v3, AMD+Intel, EEVDF|x86-64-v3, AMD+Intel, EEVDF+BORE|g' "$BORE_DIR/PKGBUILD"

          BORE_URL="https://raw.githubusercontent.com/CachyOS/kernel-patches/master/${MAJOR}.${MINOR}/sched/0001-bore.patch"
          if curl -fsSL "$BORE_URL" -o "$BORE_DIR/bore-scheduler.patch" 2>/dev/null \
             && [[ -s "$BORE_DIR/bore-scheduler.patch" ]]; then
            echo "Parche BORE descargado para ${MAJOR}.${MINOR}"

            if grep -qE '^\s*"config"' "$BORE_DIR/PKGBUILD"; then
              sed -i -E 's|^(\s*)"config"|\1"config"\n\1"bore-scheduler.patch"|' "$BORE_DIR/PKGBUILD"
              echo "bore-scheduler.patch añadido a source=()"
            else
              echo "[WARN] No se encontró \"config\" en source=() — patch no insertado, build sin BORE"
            fi

            sed -i '/^sha256sums=(/,/^)/d' "$BORE_DIR/PKGBUILD"
            printf "\nsha256sums=('SKIP' 'SKIP' 'SKIP')\n" >> "$BORE_DIR/PKGBUILD"
            echo "sha256sums actualizado con entrada para bore-scheduler.patch"
          else
            echo "Parche BORE no disponible - usara EEVDF con HZ=1000"
          fi

          sudo -u builder env \
            JOBS="$JOBS" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=${{ env.MARCH }} -mtune=generic" \
            bash -c '
              set -euo pipefail
              cd '"$BORE_DIR"'
              MAKEFLAGS="-j${JOBS}" \
              makepkg -s --noconfirm --needed --skippgpcheck
            '

      - name: Compilar linux-avalos-compat (x86-64-v2)
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          JOBS=$(nproc)

          # FIX (16-ago): mismo motivo que en el paso de BORE de arriba —
          # src/ y pkg/ del build estándar (v3) quedarían duplicados dentro
          # de COMPAT_DIR si no se limpian antes del 'cp -r', arrastrando un
          # árbol ya compilado con las flags equivocadas (-march=x86-64-v3
          # en vez de v2) y arriesgando espacio en disco del runner.
          rm -rf "${{ env.PKGBUILD_DIR }}/src" "${{ env.PKGBUILD_DIR }}/pkg"

          COMPAT_DIR="${{ env.PKGBUILD_DIR }}-compat"
          cp -r "${{ env.PKGBUILD_DIR }}" "$COMPAT_DIR"
          chown -R builder:builder "$COMPAT_DIR"

          sed -i 's|^pkgbase=linux-avalos$|pkgbase=linux-avalos-compat|' "$COMPAT_DIR/PKGBUILD"
          sed -i 's|pkgname=(linux-avalos linux-avalos-headers)|pkgname=(linux-avalos-compat linux-avalos-compat-headers)|' "$COMPAT_DIR/PKGBUILD"

          sed -i 's|^package_linux-avalos-headers()|package_linux-avalos-compat-headers()|' "$COMPAT_DIR/PKGBUILD"
          sed -i 's|^package_linux-avalos()|package_linux-avalos-compat()|' "$COMPAT_DIR/PKGBUILD"

          sed -i 's|provides=(\"linux=\${pkgver}\")|provides=(\"linux=\${pkgver}\" \"linux-avalos-compat=\${pkgver}\")|' "$COMPAT_DIR/PKGBUILD"

          sed -i 's|conflicts=(\"linux-avalos-compat\" \"linux-avalos-compat-headers\" \"linux-avalos-bore\" \"linux-avalos-bore-headers\")|conflicts=(\"linux-avalos\" \"linux-avalos-headers\" \"linux-avalos-bore\" \"linux-avalos-bore-headers\")|' "$COMPAT_DIR/PKGBUILD"

          cp "$COMPAT_DIR/linux-avalos.install" "$COMPAT_DIR/linux-avalos-compat.install"
          sed -i 's|linux-avalos|linux-avalos-compat|g' "$COMPAT_DIR/linux-avalos-compat.install"
          rm -f "$COMPAT_DIR/linux-avalos.install"
          sed -i 's|^install=linux-avalos\.install$|install=linux-avalos-compat.install|' "$COMPAT_DIR/PKGBUILD"

          sed -i 's|x86-64-v3, AMD+Intel, EEVDF|x86-64-v2, AMD+Intel, EEVDF (Celeron N/Pentium Silver, sin AVX2)|g' "$COMPAT_DIR/PKGBUILD"

          echo "PKGBUILD compat generado:"
          grep -E "^pkg(base|name|ver|rel)" "$COMPAT_DIR/PKGBUILD"

          sudo -u builder env \
            JOBS="$JOBS" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=${{ env.MARCH_COMPAT }} -mtune=generic" \
            bash -c '
              set -euo pipefail
              cd '"$COMPAT_DIR"'
              MAKEFLAGS="-j${JOBS}" \
              makepkg -s --noconfirm --needed --skippgpcheck
            '

      - name: Generar base de datos del repo de pacman
        run: |
          mkdir -p /tmp/avalos-repo

          find ${{ env.PKGBUILD_DIR }} \
               -name "*.pkg.tar.zst" 2>/dev/null \
               -exec cp {} /tmp/avalos-repo/ \;

          BORE_DIR="${{ env.PKGBUILD_DIR }}-bore"
          find "$BORE_DIR" \
               -name "*.pkg.tar.zst" 2>/dev/null \
               -exec cp {} /tmp/avalos-repo/ \; || true

          COMPAT_DIR="${{ env.PKGBUILD_DIR }}-compat"
          find "$COMPAT_DIR" \
               -name "*.pkg.tar.zst" 2>/dev/null \
               -exec cp {} /tmp/avalos-repo/ \; || true

          cd /tmp/avalos-repo

          PKG_COUNT=$(ls *.pkg.tar.zst 2>/dev/null | wc -l)
          if [[ "$PKG_COUNT" -eq 0 ]]; then
            echo "Error: no hay paquetes compilados"
            exit 1
          fi
          echo "$PKG_COUNT paquetes encontrados"

          repo-add --new avalos.db.tar.zst *.pkg.tar.zst

          [[ -L avalos.db ]] && cp --remove-destination avalos.db.tar.zst avalos.db
          [[ -L avalos.files ]] && cp --remove-destination avalos.files.tar.zst avalos.files

          echo "Contenido del repo:"
          ls -lh

      - name: Firmar paquetes y base de datos con GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd /tmp/avalos-repo

          if [[ -z "$(echo -n "$GPG_PRIVATE_KEY" | tr -d '[:space:]')" ]]; then
            echo "Error: el secret GPG_PRIVATE_KEY esta vacio o no existe en este repo"
            echo "Revisa Settings > Secrets and variables > Actions"
            exit 1
          fi

          if echo "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY"; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          fi

          GPG_FPR=$(gpg --list-secret-keys --with-colons --fingerprint 2>/dev/null | awk -F: '/^fpr:/ { print $10; exit }')
          if [[ -z "$GPG_FPR" ]]; then
            echo "Error: la importacion no genero ninguna llave secreta utilizable"
            exit 1
          fi
          echo "Llave secreta importada: $GPG_FPR"

          echo "${GPG_FPR}:6:" | gpg --import-ownertrust

          if [[ -z "$(echo -n "$GPG_PASSPHRASE" | tr -d '[:space:]')" ]]; then
            echo "Error: el secret GPG_PASSPHRASE esta vacio o no existe en este repo"
            echo "Revisa Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo "allow-loopback-pinentry" >> "$HOME/.gnupg/gpg-agent.conf"
          echo "default-cache-ttl 1800" >> "$HOME/.gnupg/gpg-agent.conf"
          echo "max-cache-ttl 1800" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          sleep 1

          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --no-armor -o /dev/null /dev/null
          if [[ $? -ne 0 ]]; then
            echo "Error: la passphrase no desbloqueo la llave secreta, revisa el secret GPG_PASSPHRASE"
            exit 1
          fi
          echo "Passphrase valida, cache del agente listo"

          for pkg in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor "$pkg"
            echo "  ✓ Firmado: $pkg"
          done

          rm -f avalos.db.tar.zst avalos.db avalos.files.tar.zst avalos.files
          repo-add --sign --new avalos.db.tar.zst *.pkg.tar.zst

          [[ -L avalos.db ]]    && cp --remove-destination avalos.db.tar.zst    avalos.db
          [[ -L avalos.files ]] && cp --remove-destination avalos.files.tar.zst avalos.files
          [[ -f avalos.db.tar.zst.sig ]]    && cp --remove-destination avalos.db.tar.zst.sig    avalos.db.sig
          [[ -f avalos.files.tar.zst.sig ]] && cp --remove-destination avalos.files.tar.zst.sig avalos.files.sig

          echo "Repo firmado y listo:"
          ls -lh

      - name: Publicar en GitHub Releases
        run: |
          cd /tmp/avalos-repo
          shopt -s nullglob
          ALL_FILES=(*.pkg.tar.zst *.pkg.tar.zst.sig *.db.tar.zst *.db.tar.zst.sig *.db *.db.sig *.files.tar.zst *.files.tar.zst.sig *.files *.files.sig)
          shopt -u nullglob

          if [[ ${#ALL_FILES[@]} -eq 0 ]]; then
            echo "Error: no hay archivos para subir"
            exit 1
          fi

          gh release upload "${{ env.REPO_TAG }}" \
            "${ALL_FILES[@]}" \
            --repo "${{ env.AVALOS_REPO }}" \
            --clobber

          echo "upload_ok=true" >> "$GITHUB_ENV"
          echo "Publicado en:"
          echo "https://github.com/${{ env.AVALOS_REPO }}/releases/tag/${{ env.REPO_TAG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Limpiar paquetes anteriores del release
        if: env.upload_ok == 'true'
        run: |
          echo "Limpiando paquetes de versiones anteriores..."
          CURRENT_FILES=$(ls /tmp/avalos-repo/*.pkg.tar.zst 2>/dev/null | xargs -I{} basename {} || true)
          gh release view "${{ env.REPO_TAG }}" \
            --repo "${{ env.AVALOS_REPO }}" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null \
            | grep '\.pkg\.tar\.zst$' \
            | while IFS= read -r asset; do
              if ! echo "$CURRENT_FILES" | grep -qxF "$asset"; then
                echo "  Eliminando obsoleto: $asset"
                gh release delete-asset "${{ env.REPO_TAG }}" "$asset" \
                  --repo "${{ env.AVALOS_REPO }}" -y 2>/dev/null || true
              fi
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ needs.check-version.outputs.kernel_ver }}
          path: |
            ${{ env.PKGBUILD_DIR }}/*.log
            ${{ env.PKGBUILD_DIR }}-bore/*.log
            ${{ env.PKGBUILD_DIR }}-compat/*.log
          retention-days: 7
          if-no-files-found: ignore

  notify:
    name: Resumen
    needs: [check-version, build-kernel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del build
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          BUILD_RESULT="${{ needs.build-kernel.result }}"
          BORE_RESULT="${{ needs.build-kernel.outputs.bore_result }}"
          echo "## AvalOS Kernel Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${KERNEL_VER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resultado | ${BUILD_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          # FIX: con continue-on-error en el step de BORE, un fallo ahí ya
          # no bloquea el resto del pipeline — pero eso no debe significar
          # que el fallo quede invisible. Esta fila lo muestra siempre.
          if [[ "$BORE_RESULT" == "failure" ]]; then
            echo "| BORE | ⚠️ falló este ciclo (parche upstream de CachyOS aún no actualizado para esta versión exacta — normal, no es bug de AvalOS) |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$BORE_RESULT" ]]; then
            echo "| BORE | ${BORE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Arquitectura | x86-64-v3 (AMD+Intel) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compilador | Clang/LLVM + ThinLTO |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Publicado en: https://github.com/${{ env.AVALOS_REPO }}/releases/tag/${{ env.REPO_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          fi
