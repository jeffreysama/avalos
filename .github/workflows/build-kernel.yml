name: Build linux-avalos

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Version del kernel (vacio = ultima estable)"
        required: false
        default: ""
      force_rebuild:
        description: "Forzar rebuild"
        type: boolean
        default: false
      build_bore:
        description: "Construir linux-avalos-bore (BORE scheduler)"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"

env:
  GITHUB_REPO: jeffreysama/avalos
  REPO_TAG: repo
  MARCH: x86-64-v3
  MARCH_COMPAT: x86-64   # Para CPUs sin AVX2: Celeron N-series, Pentium Silver, hardware antiguo
  PKGBUILD_DIR: pkgs/linux-avalos
  # Version de fallback — se actualiza manualmente si kernel.org no responde
  FALLBACK_KERNEL_VER: "7.0.10"

jobs:
  check-version:
    name: Verificar version del kernel
    runs-on: ubuntu-latest
    outputs:
      kernel_ver: ${{ steps.get_ver.outputs.kernel_ver }}
      should_build: ${{ steps.check_build.outputs.should_build }}
    steps:
      - name: Obtener ultima version estable
        id: get_ver
        run: |
          # Si el usuario especificó una versión manualmente, usarla
          if [[ -n "${{ github.event.inputs.kernel_version }}" ]]; then
            KERNEL_VER="${{ github.event.inputs.kernel_version }}"
            echo "Version especificada manualmente: $KERNEL_VER"
          else
            # Intentar varias fuentes de kernel.org
            KERNEL_VER=""

            # Fuente 1: finger_banner
            KERNEL_VER=$(curl -fsSL --max-time 15 https://www.kernel.org/finger_banner 2>/dev/null \
              | grep "stable:" \
              | grep -oP '\d+\.\d+\.\d+' \
              | head -1 || true)

            # Fuente 2: API JSON de kernel.org
            if [[ -z "$KERNEL_VER" ]]; then
              echo "finger_banner fallo, intentando API JSON..."
              KERNEL_VER=$(curl -fsSL --max-time 15 https://www.kernel.org/releases.json 2>/dev/null \
                | grep -oP '"version"\s*:\s*"\K[0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 || true)
            fi

            # Fuente 3: fallback hardcodeado
            if [[ -z "$KERNEL_VER" ]]; then
              echo "Todas las fuentes fallaron, usando version de fallback: ${{ env.FALLBACK_KERNEL_VER }}"
              KERNEL_VER="${{ env.FALLBACK_KERNEL_VER }}"
            fi
          fi

          echo "kernel_ver=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "Version final: $KERNEL_VER"

      - name: Revisar si ya esta construida
        id: check_build
        run: |
          KERNEL_VER="${{ steps.get_ver.outputs.kernel_ver }}"
          FORCE="${{ github.event.inputs.force_rebuild }}"

          if [[ "$FORCE" == "true" ]]; then
            echo "Rebuild forzado"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING=$(gh release view "${{ env.REPO_TAG }}" \
            --repo "${{ env.GITHUB_REPO }}" \
            --json assets \
            --jq ".assets[].name" 2>/dev/null \
            | grep "linux-avalos-${KERNEL_VER}" || true)

          if [[ -n "$EXISTING" ]]; then
            echo "La version $KERNEL_VER ya esta publicada - omitiendo build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "La version $KERNEL_VER no esta publicada - iniciando build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kernel:
    name: Compilar linux-avalos
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar dependencias de build
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git curl wget \
            bc bison flex python \
            clang llvm lld \
            pahole cpio perl tar xz zstd libelf \
            github-cli

      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Crear usuario builder
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Actualizar pkgver en PKGBUILD
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          sed -i "s|^pkgver=.*|pkgver=${KERNEL_VER}|" ${{ env.PKGBUILD_DIR }}/PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" ${{ env.PKGBUILD_DIR }}/PKGBUILD
          echo "PKGBUILD actualizado:"
          grep -E "^pkg(ver|rel)" ${{ env.PKGBUILD_DIR }}/PKGBUILD

      - name: Generar config base del kernel
        run: |
          if [[ ! -f "${{ env.PKGBUILD_DIR }}/gen-config.sh" ]]; then
            echo "Error: gen-config.sh no encontrado en ${{ env.PKGBUILD_DIR }}"
            exit 1
          fi
          if [[ ! -x "${{ env.PKGBUILD_DIR }}/gen-config.sh" ]]; then
            echo "gen-config.sh existe pero no tiene permiso de ejecución — añadiendo..."
            chmod +x "${{ env.PKGBUILD_DIR }}/gen-config.sh"
          fi
          chown -R builder:builder ${{ env.PKGBUILD_DIR }}
          sudo -u builder bash ${{ env.PKGBUILD_DIR }}/gen-config.sh

      # FIX: JOBS se pasa como variable de entorno explícita a sudo -u builder.
      # Antes: MAKEFLAGS='-j${JOBS}' dentro de bash -c "..." con comillas dobles
      # nunca expandía ${JOBS} — el kernel compilaba en single-thread en CI.
      # Ahora: env JOBS="$JOBS" lo inyecta en el entorno del subshell y las
      # comillas simples internas preservan la expansión correctamente.
      - name: Compilar linux-avalos
        run: |
          chown -R builder:builder ${{ env.PKGBUILD_DIR }}
          JOBS=$(nproc)
          sudo -u builder env \
            JOBS="$JOBS" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=${{ env.MARCH }} -mtune=generic" \
            bash -c '
              set -euo pipefail
              cd '"${{ env.PKGBUILD_DIR }}"'
              MAKEFLAGS="-j${JOBS}" \
              makepkg -s --noconfirm --needed --skippgpcheck
            '

      - name: Compilar linux-avalos-bore
        if: github.event.inputs.build_bore == 'true' || github.event_name == 'schedule'
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          MAJOR="${KERNEL_VER%%.*}"
          MINOR="${KERNEL_VER#*.}"; MINOR="${MINOR%.*}"
          JOBS=$(nproc)

          BORE_DIR="${{ env.PKGBUILD_DIR }}-bore"
          cp -r "${{ env.PKGBUILD_DIR }}" "$BORE_DIR"
          chown -R builder:builder "$BORE_DIR"

          sed -i 's|^pkgbase=linux-avalos$|pkgbase=linux-avalos-bore|' "$BORE_DIR/PKGBUILD"
          sed -i 's|pkgname=(linux-avalos linux-avalos-headers)|pkgname=(linux-avalos-bore linux-avalos-bore-headers)|' "$BORE_DIR/PKGBUILD"

          # Renombrar las funciones package_() para que coincidan con los nuevos pkgname.
          # makepkg busca package_<pkgname>() — si no existen, falla con exit code 12.
          # Importante: renombrar primero -headers para no hacer match parcial con la siguiente línea.
          sed -i 's|^package_linux-avalos-headers()|package_linux-avalos-bore-headers()|' "$BORE_DIR/PKGBUILD"
          sed -i 's|^package_linux-avalos()|package_linux-avalos-bore()|' "$BORE_DIR/PKGBUILD"

          # FIX: el conflicts=() original incluye "linux-avalos-bore" y "linux-avalos-bore-headers",
          # que tras el renombrado hacen que el paquete conflictúe consigo mismo (impide instalación).
          # Se reescribe para que bore conflictúe con linux-avalos (no con sí mismo).
          sed -i 's|conflicts=(\"linux-avalos-compat\" \"linux-avalos-compat-headers\" \"linux-avalos-bore\" \"linux-avalos-bore-headers\")|conflicts=(\"linux-avalos\" \"linux-avalos-headers\" \"linux-avalos-compat\" \"linux-avalos-compat-headers\")|' "$BORE_DIR/PKGBUILD"

          BORE_URL="https://raw.githubusercontent.com/firelzrd/bore-scheduler/main/patches/stable/linux-${MAJOR}.${MINOR}-bore.patch"
          if curl -fsSL "$BORE_URL" -o "$BORE_DIR/bore-scheduler.patch" 2>/dev/null \
             && [[ -s "$BORE_DIR/bore-scheduler.patch" ]]; then
            echo "Parche BORE descargado para ${MAJOR}.${MINOR}"

            # El delimitador en source=() puede ser tab o espacios — matcheamos ambos
            if grep -qE '^\s*"config"' "$BORE_DIR/PKGBUILD"; then
              sed -i -E 's|^(\s*)"config"|\1"config"\n\1"bore-scheduler.patch"|' "$BORE_DIR/PKGBUILD"
              echo "bore-scheduler.patch añadido a source=()"
            else
              echo "[WARN] No se encontró \"config\" en source=() — patch no insertado, build sin BORE"
            fi

            # FIX: reemplazar la línea completa de sha256sums en lugar de intentar
            # insertar dentro del bloque multilinea. El sed anterior con rango
            # /^sha256sums/,/^)/ fallaba cuando sha256sums estaba en una sola línea,
            # dejando el conteo de fuentes vs checksums desajustado y rompiendo makepkg.
            sed -i "s|^sha256sums=(.*)|sha256sums=('SKIP' 'SKIP' 'SKIP')|" "$BORE_DIR/PKGBUILD"
            echo "sha256sums actualizado con entrada para bore-scheduler.patch"
          else
            echo "Parche BORE no disponible - usara EEVDF con HZ=1000"
          fi

          # FIX: misma corrección de JOBS que en el paso principal
          sudo -u builder env \
            JOBS="$JOBS" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=${{ env.MARCH }} -mtune=generic" \
            bash -c '
              set -euo pipefail
              cd '"$BORE_DIR"'
              MAKEFLAGS="-j${JOBS}" \
              makepkg -s --noconfirm --needed --skippgpcheck
            '

      # ── linux-avalos-compat: x86-64 baseline ──────────────────────────────
      # Para CPUs sin AVX2: Intel Celeron N-series (Jasper Lake, Gemini Lake),
      # Pentium Silver, hardware antiguo, VMs sin extensiones modernas.
      # Mismas configs que linux-avalos pero compilado con -march=x86-64.
      - name: Compilar linux-avalos-compat (x86-64 baseline)
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          JOBS=$(nproc)

          COMPAT_DIR="${{ env.PKGBUILD_DIR }}-compat"
          cp -r "${{ env.PKGBUILD_DIR }}" "$COMPAT_DIR"
          chown -R builder:builder "$COMPAT_DIR"

          # Renombrar paquete a linux-avalos-compat
          sed -i 's|^pkgbase=linux-avalos$|pkgbase=linux-avalos-compat|' "$COMPAT_DIR/PKGBUILD"
          sed -i 's|pkgname=(linux-avalos linux-avalos-headers)|pkgname=(linux-avalos-compat linux-avalos-compat-headers)|' "$COMPAT_DIR/PKGBUILD"

          # Renombrar funciones package_()
          sed -i 's|^package_linux-avalos-headers()|package_linux-avalos-compat-headers()|' "$COMPAT_DIR/PKGBUILD"
          sed -i 's|^package_linux-avalos()|package_linux-avalos-compat()|' "$COMPAT_DIR/PKGBUILD"

          # provides: compat no provee "linux=" para evitar sobreescrituras con DKMS
          sed -i 's|provides=(\"linux=\${pkgver}\" \"linux-avalos=\${pkgver}\")|provides=(\"linux-avalos-compat=\${pkgver}\")|' "$COMPAT_DIR/PKGBUILD"

          # M-3 FIX: eliminar conflicts=() heredado antes de insertar el correcto.
          # Sin esto, compat queda con dos conflicts=() y el primero conflictúa consigo mismo.
          sed -i '/^[[:space:]]*conflicts=.*/d' "$COMPAT_DIR/PKGBUILD"
          # conflicts: compat no puede coexistir con linux-avalos (misma ruta de módulos)
          sed -i '/provides=.*linux-avalos-compat/a\    conflicts=("linux-avalos" "linux-avalos-bore" "linux-avalos-headers" "linux-avalos-bore-headers")' "$COMPAT_DIR/PKGBUILD"

          # Actualizar pkgdesc
          sed -i 's|x86-64-v3, AMD+Intel, EEVDF|x86-64 baseline, AMD+Intel, EEVDF (Celeron N/Pentium Silver/hardware antiguo)|g' "$COMPAT_DIR/PKGBUILD"

          # FIX: desactivar CONFIG_GENERIC_CPU3 en el PKGBUILD copiado.
          # Sin esto, aunque KCFLAGS use -march=x86-64, el Kconfig interno
          # añade -march=x86-64-v3 y el kernel compat termina siendo v3 igual.
          sed -i 's|-e CONFIG_GENERIC_CPU3|-e CONFIG_GENERIC_CPU1|g' "$COMPAT_DIR/PKGBUILD"

          echo "PKGBUILD compat generado:"
          grep -E "^pkg(base|name|ver|rel)" "$COMPAT_DIR/PKGBUILD"

          # FIX: misma corrección de JOBS que en el paso principal
          sudo -u builder env \
            JOBS="$JOBS" \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-march=${{ env.MARCH_COMPAT }} -mtune=generic" \
            bash -c '
              set -euo pipefail
              cd '"$COMPAT_DIR"'
              MAKEFLAGS="-j${JOBS}" \
              makepkg -s --noconfirm --needed --skippgpcheck
            '

      - name: Generar base de datos del repo de pacman
        run: |
          mkdir -p /tmp/avalos-repo

          find ${{ env.PKGBUILD_DIR }} \
               -name "*.pkg.tar.zst" 2>/dev/null \
               -exec cp {} /tmp/avalos-repo/ \;

          BORE_DIR="${{ env.PKGBUILD_DIR }}-bore"
          find "$BORE_DIR" \
               -name "*.pkg.tar.zst" 2>/dev/null \
               -exec cp {} /tmp/avalos-repo/ \; || true

          COMPAT_DIR="${{ env.PKGBUILD_DIR }}-compat"
          find "$COMPAT_DIR" \
               -name "*.pkg.tar.zst" 2>/dev/null \
               -exec cp {} /tmp/avalos-repo/ \; || true

          cd /tmp/avalos-repo

          PKG_COUNT=$(ls *.pkg.tar.zst 2>/dev/null | wc -l)
          if [[ "$PKG_COUNT" -eq 0 ]]; then
            echo "Error: no hay paquetes compilados"
            exit 1
          fi
          echo "$PKG_COUNT paquetes encontrados"

          repo-add --new avalos.db.tar.zst *.pkg.tar.zst

          [[ -L avalos.db ]] && cp --remove-destination avalos.db.tar.zst avalos.db
          [[ -L avalos.files ]] && cp --remove-destination avalos.files.tar.zst avalos.files

          echo "Contenido del repo:"
          ls -lh

      # BUG-016 FIX: separar subida y limpieza en dos pasos.
      # Si se limpia antes de subir y algo falla a mitad, el release queda vacío/inconsistente.
      # La limpieza ahora ocurre SOLO si la subida fue exitosa (condición upload_ok).
      - name: Publicar en GitHub Releases
        run: |
          cd /tmp/avalos-repo
          shopt -s nullglob
          ALL_FILES=(*.pkg.tar.zst *.db.tar.zst *.db *.files.tar.zst *.files)
          shopt -u nullglob

          if [[ ${#ALL_FILES[@]} -eq 0 ]]; then
            echo "Error: no hay archivos para subir"
            exit 1
          fi

          gh release upload "${{ env.REPO_TAG }}" \
            "${ALL_FILES[@]}" \
            --repo "${{ env.GITHUB_REPO }}" \
            --clobber

          echo "upload_ok=true" >> "$GITHUB_ENV"
          echo "Publicado en:"
          echo "https://github.com/${{ env.GITHUB_REPO }}/releases/tag/${{ env.REPO_TAG }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Limpiar paquetes anteriores del release
        if: env.upload_ok == 'true'
        run: |
          # Solo se ejecuta si la subida fue exitosa — evita dejar el release vacío.
          echo "Limpiando paquetes de versiones anteriores..."
          CURRENT_FILES=$(ls /tmp/avalos-repo/*.pkg.tar.zst 2>/dev/null | xargs -I{} basename {} || true)
          gh release view "${{ env.REPO_TAG }}" \
            --repo "${{ env.GITHUB_REPO }}" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null \
            | grep '\.pkg\.tar\.zst$' \
            | while IFS= read -r asset; do
              # Solo eliminar los que NO están en el upload actual
              if ! echo "$CURRENT_FILES" | grep -qxF "$asset"; then
                echo "  Eliminando obsoleto: $asset"
                gh release delete-asset "${{ env.REPO_TAG }}" "$asset" \
                  --repo "${{ env.GITHUB_REPO }}" -y 2>/dev/null || true
              fi
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ needs.check-version.outputs.kernel_ver }}
          path: |
            ${{ env.PKGBUILD_DIR }}/*.log
            ${{ env.PKGBUILD_DIR }}-bore/*.log
            ${{ env.PKGBUILD_DIR }}-compat/*.log
          retention-days: 7
          if-no-files-found: ignore

  notify:
    name: Resumen
    needs: [check-version, build-kernel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del build
        run: |
          KERNEL_VER="${{ needs.check-version.outputs.kernel_ver }}"
          BUILD_RESULT="${{ needs.build-kernel.result }}"
          echo "## AvalOS Kernel Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${KERNEL_VER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resultado | ${BUILD_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arquitectura | x86-64-v3 (AMD+Intel) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compilador | Clang/LLVM + ThinLTO |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Publicado en: https://github.com/${{ env.GITHUB_REPO }}/releases/tag/${{ env.REPO_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          fi
