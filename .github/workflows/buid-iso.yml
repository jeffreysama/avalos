name: Build AvalOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (vacio = fecha actual YYYY.MM.DD)"
        required: false
        default: ""
      upload:
        description: "Subir ISO a GitHub Releases"
        type: boolean
        default: true

env:
  AVALOS_REPO: jeffreysama/avalos
  AVALOS_REPO_URL: https://github.com/jeffreysama/avalos/releases/download/repo
  BUILD_DIR: /tmp/avalos-iso-profile

jobs:
  build-iso:
    name: Construir AvalOS ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para gh release create/upload
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Instalar dependencias base
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso \
            git curl wget \
            github-cli \
            python \
            squashfs-tools \
            dosfstools \
            mtools \
            libisoburn \
            erofs-utils \
            imagemagick

      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo necesario para git describe --tags

      - name: Configurar repo [avalos] en pacman
        run: |
          # Inyectar el repo avalos para que mkarchiso pueda descargar linux-avalos
          cat >> /etc/pacman.conf << 'EOF'

          [avalos]
          SigLevel = Optional TrustAll
          Server = https://github.com/jeffreysama/avalos/releases/download/repo
          EOF
          pacman -Sy --noconfirm
          echo "Repo avalos configurado:"
          pacman -Si linux-avalos | grep -E "Name|Version" || echo "[WARN] linux-avalos no disponible aun"

      - name: Determinar version
        id: vars
        run: |
          # Version
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Intentar desde git tag
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            [[ -z "$VERSION" ]] && VERSION=$(date +%Y.%m.%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          # Ambos kernels siempre incluidos — se selecciona automáticamente al bootear.
          # El instalador detecta el hardware y elige el correcto durante la instalación.
          echo "kernel=linux-avalos+linux-avalos-compat" >> "$GITHUB_OUTPUT"
          echo "Kernels: linux-avalos (v3) + linux-avalos-compat (baseline)"

      - name: Preparar perfil archiso
        run: |
          set -u
          VERSION="${{ steps.vars.outputs.version }}"
          AIROOTFS="$BUILD_DIR/airootfs"

          mkdir -p "$BUILD_DIR"
          cp -r /usr/share/archiso/configs/releng/. "$BUILD_DIR/"

          # profiledef.sh
          cat > "$BUILD_DIR/profiledef.sh" << PROFILEEOF
          #!/usr/bin/env bash
          iso_name="avalos-${VERSION}"
          iso_label="AVLS$(date +%y%m%d)"
          iso_publisher="AvalOS <https://github.com/jeffreysama/avalos>"
          iso_application="AvalOS — Arch-based · Hyprland · Tokyo Night"
          iso_version="${VERSION}"
          install_dir="arch"
          buildmodes=('iso')
          bootmodes=('bios.syslinux.mbr' 'bios.syslinux.eltorito' 'uefi-x64.systemd-boot.esp' 'uefi-x64.systemd-boot.eltorito')
          arch="x86_64"
          pacman_conf="pacman.conf"
          airootfs_image_type="squashfs"
          airootfs_image_tool_options=('-comp' 'zstd' '-Xcompression-level' '19' '-b' '1M')
          bootstrap_tarball_compression=('zstd' '-c' '-T0' '--auto-threads=logical' '--long' '-19')
          file_permissions=(
            ["/etc/shadow"]="0:0:400"
            ["/etc/gshadow"]="0:0:400"
            ["/root"]="0:0:750"
            ["/usr/local/bin/avalos-install"]="0:0:755"
            ["/usr/local/bin/avalos-gpu-env"]="0:0:755"
          )
          PROFILEEOF
          chmod +x "$BUILD_DIR/profiledef.sh"

          # pacman.conf del ISO — incluye repo avalos
          cp /etc/pacman.conf "$BUILD_DIR/pacman.conf"
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' "$BUILD_DIR/pacman.conf"
          # Asegurar que el repo avalos esté en el pacman.conf del ISO
          if ! grep -q '\[avalos\]' "$BUILD_DIR/pacman.conf"; then
            printf '\n[avalos]\nSigLevel = Optional TrustAll\nServer = https://github.com/jeffreysama/avalos/releases/download/repo\n' >> "$BUILD_DIR/pacman.conf"
          fi
          # Sin nvidia — AvalOS es AMD/Intel only.
          # Usuarios de NVIDIA deberán instalar drivers manualmente post-instalación.
          # (No se bloquea vía IgnorePkg porque ese mecanismo es para upgrades, no installs)
          # Habilitar multilib para paquetes lib32
          if ! grep -q '^\[multilib\]' "$BUILD_DIR/pacman.conf"; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> "$BUILD_DIR/pacman.conf"
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "AIROOTFS=$AIROOTFS" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KERNEL=${{ steps.vars.outputs.kernel }}" >> "$GITHUB_ENV"

      - name: Generar packages.x86_64
        run: |
          set -u
          KERNEL="${{ steps.vars.outputs.kernel }}"
          python3 - "$BUILD_DIR/packages.x86_64" "$KERNEL" << 'PKGPYEOF'
          import sys
          dest, kernel = sys.argv[1], sys.argv[2]
          pkgs = [
              f"# Kernel — ambos siempre incluidos para detección automática de hardware",
              # Live USB solo lleva linux-avalos-compat (baseline x86-64).
              # Funciona en TODOS los CPUs (Celeron N, hardware antiguo, moderno).
              # El instalador detecta el CPU y pone el kernel correcto:
              #   x86-64-v3/v4 → linux-avalos (optimizado AVX2)
              #   x86-64/v2    → linux-avalos-compat (se queda con este)
              "linux-avalos-compat",
              "# Firmware — cubre AMD, Intel, WiFi, Ethernet, Bluetooth y demás",
              "linux-firmware",
              "intel-ucode",
              "amd-ucode",
              "# Base",
              "base", "base-devel", "sudo", "bash", "bash-completion",
              "# Hyprland",
              "hyprland", "hyprpaper", "waybar", "wofi", "kitty",
              "sddm", "qt5-graphicaleffects", "plymouth",
              "qt5-wayland", "qt6-wayland", "polkit-kde-agent",
              "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk",
              "# Audio",
              "pipewire", "pipewire-pulse", "pipewire-alsa", "wireplumber",
              "# GPU AMD",
              "mesa", "vulkan-radeon", "libva-mesa-driver",
              "lib32-mesa", "lib32-vulkan-radeon",
              "# GPU Intel",
              "vulkan-intel", "intel-media-driver",
              "libva-intel-driver", "lib32-vulkan-intel",
              "# Fuentes",
              "ttf-jetbrains-mono-nerd", "ttf-nerd-fonts-symbols",
              "noto-fonts", "noto-fonts-emoji",
              "# Live tools",
              "networkmanager", "nm-connection-editor",
              "git", "curl", "wget", "python", "python-pip",
              "fastfetch", "htop", "nano", "vim",
              "grim", "slurp", "wl-clipboard", "xdg-utils",
              "udisks2", "udiskie", "gvfs", "thunar", "file-roller", "firefox",
              "# Instalacion",
              "arch-install-scripts", "parted", "dosfstools",
              "e2fsprogs", "btrfs-progs", "gptfdisk",
              "refind",
              "# archiso",
              "archiso", "syslinux", "edk2-shell",
          ]
          with open(dest, 'w') as f:
              f.write('\n'.join(pkgs) + '\n')
          print(f"packages.x86_64 generado ({len([p for p in pkgs if not p.startswith('#')])} paquetes)")
          PKGPYEOF
          # pacman.conf del ISO — IgnorePkg evita que linux-avalos (v3) entre como
          # dependencia transitiva; el live solo necesita linux-avalos-compat
          sed -i 's/^#IgnorePkg.*/IgnorePkg = linux-avalos linux-avalos-headers/' \
            "$BUILD_DIR/pacman.conf" 2>/dev/null || \
            echo "IgnorePkg = linux-avalos linux-avalos-headers" >> "$BUILD_DIR/pacman.conf"

          wc -l "$BUILD_DIR/packages.x86_64"

      - name: Configurar airootfs (scripts, configs, wallpaper)
        run: |
          set -u
          mkdir -p "$AIROOTFS/usr/local/bin"
          mkdir -p "$AIROOTFS/root/.config/hypr"
          mkdir -p "$AIROOTFS/root/.config/waybar"
          mkdir -p "$AIROOTFS/root/.config/kitty"
          mkdir -p "$AIROOTFS/etc/sddm.conf.d"
          mkdir -p "$AIROOTFS/etc/systemd/system/graphical.target.wants"
          mkdir -p "$AIROOTFS/etc/pacman.d"

          # ── Copiar configs al live Y a /usr/share/avalos/configs (para el instalador) ──
          # El instalador (skill_instalar_usb.py) lee desde /usr/share/avalos/configs/
          # en lugar de tener todo hardcodeado. Así solo hay un lugar donde editar configs.
          mkdir -p "$AIROOTFS/usr/share/avalos/configs"
          cp -r configs/. "$AIROOTFS/usr/share/avalos/configs/"

          # Copiar al live también (sesión en vivo del USB)
          [[ -f "configs/hyprland/hyprpaper.conf" ]] && \
            cp configs/hyprland/hyprpaper.conf "$AIROOTFS/root/.config/hypr/hyprpaper.conf"
          [[ -f "configs/kitty/kitty.conf" ]] && \
            cp configs/kitty/kitty.conf "$AIROOTFS/root/.config/kitty/kitty.conf"
          [[ -f "configs/waybar/config.jsonc" ]] && \
            cp configs/waybar/config.jsonc "$AIROOTFS/root/.config/waybar/config.jsonc"
          [[ -f "configs/waybar/style.css" ]] && \
            cp configs/waybar/style.css "$AIROOTFS/root/.config/waybar/style.css"

          # Preset de mkinitcpio para linux-avalos-compat (único kernel del live)
          mkdir -p "$AIROOTFS/etc/mkinitcpio.d"
          cat > "$AIROOTFS/etc/mkinitcpio.d/linux-avalos-compat.preset" << 'PRESETEOF'
          ALL_config='/etc/mkinitcpio.conf'
          ALL_kver='/boot/vmlinuz-linux-avalos-compat'
          PRESETS=('default' 'fallback' 'archiso')

          default_image='/boot/initramfs-linux-avalos-compat.img'
          fallback_image='/boot/initramfs-linux-avalos-compat-fallback.img'
          fallback_options='-S autodetect'

          archiso_config='/etc/mkinitcpio.conf.d/archiso.conf'
          archiso_image='/boot/initramfs-linux.img'
          PRESETEOF
          cp /etc/pacman.d/mirrorlist "$AIROOTFS/etc/pacman.d/mirrorlist" 2>/dev/null || \
            echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' \
              > "$AIROOTFS/etc/pacman.d/mirrorlist"

          # archiso.conf: hooks mínimos para el initramfs del live
          mkdir -p "$AIROOTFS/etc/mkinitcpio.conf.d"
          cat > "$AIROOTFS/etc/mkinitcpio.conf.d/archiso.conf" << 'ARCHISOCONF'
          HOOKS=(base systemd keyboard sd-vconsole archiso block filesystems)
          COMPRESSION="zstd"
          ARCHISOCONF

          # Crear /efi y /boot para que mkinitcpio no falle en chroot
          mkdir -p "$AIROOTFS/efi/EFI/Linux"
          mkdir -p "$AIROOTFS/boot"

          # Symlink: mkarchiso necesita vmlinuz-linux en /boot
          ln -sf vmlinuz-linux-avalos-compat "$AIROOTFS/boot/vmlinuz-linux" 2>/dev/null || true

          # pacman.conf dentro del airootfs
          cp "$BUILD_DIR/pacman.conf" "$AIROOTFS/etc/pacman.conf"

          # Copiar instalador si existe en el repo
          if [[ -f "scripts/skill_instalar_usb.py" ]]; then
            cp scripts/skill_instalar_usb.py "$AIROOTFS/usr/local/bin/avalos-install"
            chmod 755 "$AIROOTFS/usr/local/bin/avalos-install"
            echo "Instalador copiado"
          else
            echo "[WARN] scripts/skill_instalar_usb.py no encontrado — live sin instalador grafico"
          fi

          # customize_airootfs.sh — mkarchiso lo ejecuta dentro del chroot
          # Se usa para instalar paquetes que no están en repos (ej: python-pywebview via pip)
          cat > "$AIROOTFS/root/customize_airootfs.sh" << 'CUSTOMEOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "[AvalOS] Ejecutando customize_airootfs.sh..."

          # python-pywebview no está en repos oficiales ni en [avalos] — instalar via pip
          pip install pywebview --break-system-packages --quiet \
            && echo "[AvalOS] python-pywebview instalado OK" \
            || echo "[WARN] python-pywebview falló — el instalador gráfico no funcionará"
          CUSTOMEOF
          chmod 755 "$AIROOTFS/root/customize_airootfs.sh"

          # avalos-gpu-env
          cat > "$AIROOTFS/usr/local/bin/avalos-gpu-env" << 'GPUEOF'
          #!/bin/bash
          HYPR_CFG="$HOME/.config/hypr/gpu-env.conf"
          mkdir -p "$(dirname "$HYPR_CFG")"
          if lspci 2>/dev/null | grep -qiE 'amd|radeon|amdgpu'; then
              printf 'env = AMD_VULKAN_ICD,RADV\nenv = VDPAU_DRIVER,radeonsi\nenv = LIBVA_DRIVER_NAME,radeonsi\n' > "$HYPR_CFG"
          elif lspci 2>/dev/null | grep -qiE 'intel.*(graphics|vga|display)'; then
              printf 'env = LIBVA_DRIVER_NAME,iHD\nenv = VDPAU_DRIVER,va_gl\n' > "$HYPR_CFG"
          else
              : > "$HYPR_CFG"
          fi
          GPUEOF
          chmod 755 "$AIROOTFS/usr/local/bin/avalos-gpu-env"

          # gpu-detect service (corre antes de SDDM)
          cat > "$AIROOTFS/etc/systemd/system/avalos-gpu-detect.service" << 'SVCEOF'
          [Unit]
          Description=AvalOS GPU Environment Detection
          Before=sddm.service display-manager.service
          After=systemd-udev-settle.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/avalos-gpu-env
          RemainAfterExit=yes

          [Install]
          WantedBy=graphical.target
          SVCEOF
          ln -sf /etc/systemd/system/avalos-gpu-detect.service \
              "$AIROOTFS/etc/systemd/system/graphical.target.wants/avalos-gpu-detect.service"

          # SDDM autologin root en live
          mkdir -p "$AIROOTFS/etc/sddm.conf.d"
          printf '[Autologin]\nUser=root\nSession=hyprland\n' \
            > "$AIROOTFS/etc/sddm.conf.d/autologin.conf"
          # Habilitar sddm.service en el live (critical: sin esto Hyprland nunca arranca)
          ln -sf /usr/lib/systemd/system/sddm.service \
              "$AIROOTFS/etc/systemd/system/display-manager.service"
          ln -sf /usr/lib/systemd/system/sddm.service \
              "$AIROOTFS/etc/systemd/system/graphical.target.wants/sddm.service"

          # Wallpaper: fondo Tokyo Night sólido (el branding step lo sobreescribe con logo)
          convert -size 1920x1080 xc:"#1a1b26" "$AIROOTFS/root/.config/hypr/wallpaper.png"

          # hyprpaper.conf — desde configs/ del repo
          if [[ -f "configs/hyprland/hyprpaper.conf" ]]; then
            cp configs/hyprland/hyprpaper.conf "$AIROOTFS/root/.config/hypr/hyprpaper.conf"
          else
            printf 'preload = ~/.config/hypr/wallpaper.png\nwallpaper = ,~/.config/hypr/wallpaper.png\nsplash = false\n' \
              > "$AIROOTFS/root/.config/hypr/hyprpaper.conf"
          fi

          # waybar — desde configs/ del repo
          mkdir -p "$AIROOTFS/root/.config/waybar"
          if [[ -f "configs/waybar/config.jsonc" ]]; then
            cp configs/waybar/config.jsonc "$AIROOTFS/root/.config/waybar/config.jsonc"
          fi
          if [[ -f "configs/waybar/style.css" ]]; then
            cp configs/waybar/style.css "$AIROOTFS/root/.config/waybar/style.css"
          fi

          # rofi — desde configs/ del repo
          mkdir -p "$AIROOTFS/root/.config/rofi"
          if [[ -f "configs/rofi/config.rasi" ]]; then
            cp configs/rofi/config.rasi "$AIROOTFS/root/.config/rofi/config.rasi"
          fi

          # gpu-env.conf vacio (se sobreescribe por el servicio antes de Hyprland)
          touch "$AIROOTFS/root/.config/hypr/gpu-env.conf"

          # hyprland.conf — desde configs/ del repo
          if [[ -f "configs/hyprland/hyprland.conf" ]]; then
            cp configs/hyprland/hyprland.conf "$AIROOTFS/root/.config/hypr/hyprland.conf"
          else
            echo "[WARN] configs/hyprland/hyprland.conf no encontrado"
          fi
          # kitty.conf — desde configs/ del repo
          if [[ -f "configs/kitty/kitty.conf" ]]; then
            cp configs/kitty/kitty.conf "$AIROOTFS/root/.config/kitty/kitty.conf"
          else
            echo "[WARN] configs/kitty/kitty.conf no encontrado"
          fi

          # sysctl BBR
          mkdir -p "$AIROOTFS/etc/sysctl.d"
          cat > "$AIROOTFS/etc/sysctl.d/80-avalos-bbr.conf" << 'BBREOF'
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          BBREOF


          # Fastfetch — logo AvalOS + Tokyo Night (Python write — evita col-0 YAML)
          mkdir -p "$AIROOTFS/etc/fastfetch" "$AIROOTFS/root/.config/fastfetch"
          python3 - "$AIROOTFS" << 'FFPYEOF'
          import sys, os, textwrap
          A = sys.argv[1]
          def w(p, c, raw=False):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              txt = c if raw else textwrap.dedent(c).lstrip('\n')
              with open(p, 'w') as f:
                  f.write(txt)
          w(f"{A}/etc/fastfetch/avalos.txt",
            "$1                          \u028c\n"
            "$1                         /#\\\n"
            "$1                        /#$2@$1#\\\n"
            "$1                       /#$2@$3$$$2@$1#\\\n"
            "$1                ___   /#$3$$$2@$1\u028c$2@$3$$$1#\\    ___\n"
            "$1                \\$4&&$1\\ /#$3$$$2@$1/$3$$$1\\$2@$1##\\  /$4&&$1/\n"
            "$1                 \\$4&&$1\\#$3$$$2@$1/$3$$$$$$$1\\$2@$1##\\/$4&&$1/\n"
            "$1                  \\$4&&$1\\$2@$1/$3$$$$$1\u028c$3$$$$$1\\$2@$3$$$1#\\$4&$1/\n"
            "$1                  /\\$4&&$1\\$3$$$$$1/ \\$3$$$$$1\\$2@$3$$$1#\\\n"
            "$1                 /#$3$$$1\\$4&&$1\\/   \\$3$$$$$1\\$2@$3$$$1#\\\n"
            "$1                /#$3$$$2@$1/\\$4&&$1\\    \\$3$$$$$1\\$2@$3$$$1#\\\n"
            "$1               /#$3$$$2@$1/$3$$$$$1\\$4&&$1\\  /$4&$1\\$3$$$$$1\\$2@$3$$$1#\\\n"
            "$1              /#$3$$$2@$1/$3$$$$$1/ \\$4&&$1\\/$4&&$1/\\$3$$$$$1\\$2@$3$$$1#\\\n"
            "$1             /#$3$$$2@$1/$3$$$$$1/   \\$4&&&&$1/  \\$3$$$$$1\\$2@$3$$$1#\\\n"
            "$1             \\#$3$$$1/$3$$$$$1/     \\$4&&$1/    \\$3$$$$$1\\$2@$3$$$1/\n"
            "$1              \\/__/       \\/      \\__\\/\n",
            raw=True)
          w(f"{A}/root/.config/fastfetch/config.jsonc", """
              {
                "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
                "logo": {
                  "source": "/etc/fastfetch/avalos.txt",
                  "colors": ["38;2;122;162;247","38;2;125;207;255","38;2;187;154;247","38;2;158;206;106"],
                  "padding": { "top": 1, "right": 2 }
                },
                "display": {
                  "separator": " \u2192 ",
                  "color": { "keys": "38;2;122;162;247", "title": "38;2;125;207;255", "output": "38;2;192;202;245" }
                },
                "modules": [
                  { "type": "title",    "format": "{user-name}@{host-name}" },
                  "separator",
                  { "type": "os",       "key": " OS",          "format": "AvalOS ({distro-id})" },
                  { "type": "host",     "key": "\uf0e4 Host" },
                  { "type": "kernel",   "key": " Kernel" },
                  { "type": "uptime",   "key": "\uf55f Uptime" },
                  { "type": "packages", "key": "\uf439 Paquetes" },
                  { "type": "shell",    "key": " Shell" },
                  { "type": "display",  "key": "\uf879 Resoluci\u00f3n" },
                  { "type": "wm",       "key": " WM" },
                  { "type": "terminal", "key": " Terminal" },
                  "separator",
                  { "type": "cpu",    "key": " CPU",   "showPeCoreCount": true, "temp": true },
                  { "type": "gpu",    "key": "\\uf43f GPU",  "temp": true },
                  { "type": "memory", "key": "\uf55b RAM" },
                  { "type": "disk",   "key": "\uf4cb Disco", "folders": "/" },
                  "separator",
                  { "type": "colors", "paddingLeft": 2, "symbol": "circle" }
                ]
              }
              """)
          print("Fastfetch OK")
          FFPYEOF


          echo "airootfs configurado"


      - name: Branding completo (logo, os-release, wallpaper, SDDM, Plymouth)
        run: |
          set -u
          AIROOTFS="$BUILD_DIR/airootfs"
          LOGO_URL="https://raw.githubusercontent.com/${{ env.AVALOS_REPO }}/main/assets/AvalOS-logo.png"

          # ── Logo: descargar al airootfs ───────────────────────────────────
          mkdir -p "$AIROOTFS/usr/share/pixmaps"
          if curl -fsSL "$LOGO_URL" -o "$AIROOTFS/usr/share/pixmaps/avalos-logo.png"; then
            echo "Logo: $(wc -c < "$AIROOTFS/usr/share/pixmaps/avalos-logo.png") bytes"
          else
            echo "[WARN] Logo no encontrado en repo — generando placeholder Tokyo Night..."
            convert -size 256x256 xc:"#1a1b26" \
              -fill "#7aa2f7" -gravity center \
              -font DejaVu-Sans -pointsize 80 -annotate 0 "A" \
              "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" \
              || convert -size 256x256 xc:"#1a1b26" \
                   "$AIROOTFS/usr/share/pixmaps/avalos-logo.png"
            echo "Logo placeholder generado"
          fi

          # ── Wallpaper: Tokyo Night 1920x1080 + logo centrado ──────────────
          convert -size 1920x1080 xc:"#1a1b26" \
            \( "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" \
               -resize 380x380 -background none \) \
            -gravity center -geometry +0-80 \
            -composite "$AIROOTFS/root/.config/hypr/wallpaper.png" \
            && echo "Wallpaper con logo OK" \
            || echo "Fallback: wallpaper solido Tokyo Night"

          # ── Archivos de config via Python (evita col-0 en YAML) ───────────
          python3 - "$AIROOTFS" << 'BRANDPYEOF'
          import sys, os, textwrap
          A = sys.argv[1]

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w') as f:
                  f.write(textwrap.dedent(content).lstrip('\n'))

          # os-release
          w(f"{A}/etc/os-release", """
              NAME="AvalOS"
              PRETTY_NAME="AvalOS"
              ID=avalos
              ID_LIKE=arch
              HOME_URL="https://github.com/jeffreysama/avalos"
              SUPPORT_URL="https://github.com/jeffreysama/avalos/issues"
              BUG_REPORT_URL="https://github.com/jeffreysama/avalos/issues"
              LOGO=avalos-logo
              BUILD_ID=rolling
              ANSI_COLOR="38;2;122;162;247"
              """)

          # SDDM — theme.conf del tema
          T = f"{A}/usr/share/sddm/themes/avalos"
          os.makedirs(T, exist_ok=True)
          import shutil
          shutil.copy(f"{A}/usr/share/pixmaps/avalos-logo.png", f"{T}/avalos-logo.png")
          w(f"{T}/theme.conf", """
              [General]
              type=theme
              name=AvalOS
              description=AvalOS - Tokyo Night
              author=AvalOS
              license=MIT
              """)

          # SDDM — Main.qml
          w(f"{T}/Main.qml", """
              import QtQuick 2.15
              import QtQuick.Controls 2.15
              import QtQuick.Layouts 1.15
              Item {
                  id: root
                  Rectangle { anchors.fill: parent; color: "#1a1b26" }
                  ColumnLayout {
                      anchors.centerIn: parent
                      spacing: 18
                      width: 300
                      Image {
                          Layout.alignment: Qt.AlignHCenter
                          source: Qt.resolvedUrl("avalos-logo.png")
                          width: 140; height: 140
                          fillMode: Image.PreserveAspectFit; smooth: true
                      }
                      Text {
                          Layout.alignment: Qt.AlignHCenter
                          text: "AvalOS"; color: "#7aa2f7"
                          font.pixelSize: 30; font.weight: Font.Light
                      }
                      Item { Layout.preferredHeight: 8 }
                      TextField {
                          id: nameField; Layout.fillWidth: true
                          text: userModel.lastUser; placeholderText: "Usuario"
                          color: "#c0caf5"; placeholderTextColor: "#565f89"
                          font.pixelSize: 13
                          leftPadding: 14; rightPadding: 14; topPadding: 10; bottomPadding: 10
                          background: Rectangle {
                              color: "#24283b"; radius: 8
                              border.color: nameField.activeFocus ? "#7aa2f7" : "#414868"; border.width: 1
                          }
                          KeyNavigation.tab: passField
                      }
                      TextField {
                          id: passField; Layout.fillWidth: true
                          placeholderText: "Contrasena"; echoMode: TextInput.Password
                          color: "#c0caf5"; placeholderTextColor: "#565f89"
                          font.pixelSize: 13
                          leftPadding: 14; rightPadding: 14; topPadding: 10; bottomPadding: 10
                          background: Rectangle {
                              color: "#24283b"; radius: 8
                              border.color: passField.activeFocus ? "#7aa2f7" : "#414868"; border.width: 1
                          }
                          Keys.onReturnPressed: doLogin()
                          KeyNavigation.tab: loginBtn
                      }
                      Text {
                          Layout.fillWidth: true; text: sddm.lastError
                          color: "#f7768e"; font.pixelSize: 11
                          wrapMode: Text.WordWrap; visible: sddm.lastError !== ""
                      }
                      Button {
                          id: loginBtn; Layout.fillWidth: true
                          text: "Iniciar sesion"
                          topPadding: 10; bottomPadding: 10
                          onClicked: doLogin()
                          Keys.onReturnPressed: doLogin()
                          background: Rectangle {
                              color: loginBtn.pressed ? "#5a7fd4" : loginBtn.hovered ? "#8aade7" : "#7aa2f7"
                              radius: 8
                              Behavior on color { ColorAnimation { duration: 100 } }
                          }
                          contentItem: Text {
                              text: loginBtn.text; color: "#1a1b26"
                              font.pixelSize: 13; font.weight: Font.Medium
                              horizontalAlignment: Text.AlignHCenter
                              verticalAlignment: Text.AlignVCenter
                          }
                      }
                  }
                  ComboBox {
                      id: sessionSelect
                      anchors { right: parent.right; bottom: parent.bottom; margins: 20 }
                      width: 170; model: sessionModel; textRole: "name"
                      background: Rectangle { color: "#24283b"; radius: 6; border.color: "#414868" }
                      contentItem: Text {
                          leftPadding: 10; text: sessionSelect.displayText
                          color: "#c0caf5"; font.pixelSize: 12; verticalAlignment: Text.AlignVCenter
                      }
                      popup.background: Rectangle { color: "#24283b"; border.color: "#414868"; radius: 6 }
                  }
                  function doLogin() {
                      sddm.login(nameField.text, passField.text, sessionSelect.currentIndex)
                  }
              }
              """)

          # SDDM — activar tema
          os.makedirs(f"{A}/etc/sddm.conf.d", exist_ok=True)
          w(f"{A}/etc/sddm.conf.d/theme.conf", """
              [Theme]
              Current=avalos
              """)

          # Plymouth — tema
          P = f"{A}/usr/share/plymouth/themes/avalos"
          os.makedirs(P, exist_ok=True)
          os.makedirs(f"{A}/etc/plymouth", exist_ok=True)
          shutil.copy(f"{A}/usr/share/pixmaps/avalos-logo.png", f"{P}/avalos-logo.png")

          w(f"{P}/avalos.plymouth", """
              [Plymouth Theme]
              Name=AvalOS
              Description=AvalOS boot splash - Tokyo Night
              ModuleName=script

              [script]
              ImageDir=/usr/share/plymouth/themes/avalos
              ScriptFile=/usr/share/plymouth/themes/avalos/avalos.script
              """)

          w(f"{P}/avalos.script", """
              screen_width  = Window.GetWidth();
              screen_height = Window.GetHeight();
              Window.SetBackgroundTopColor(0.102, 0.106, 0.149);
              Window.SetBackgroundBottomColor(0.102, 0.106, 0.149);
              logo_image  = Image("avalos-logo.png");
              logo_image  = logo_image.Scale(260, 260);
              logo_sprite = Sprite(logo_image);
              logo_sprite.SetX(Math.Int(screen_width  / 2 - 130));
              logo_sprite.SetY(Math.Int(screen_height / 2 - 150));
              logo_sprite.SetOpacity(1);
              bar_bg_sprite = Sprite(Image(300, 6));
              bar_bg_sprite.SetX(Math.Int(screen_width / 2 - 150));
              bar_bg_sprite.SetY(Math.Int(screen_height / 2 + 150));
              fun boot_progress_cb(duration, progress) {
                  bar_w = Math.Int(300 * progress);
                  if (bar_w < 2) bar_w = 2;
                  bar_sprite = Sprite(Image(bar_w, 6));
                  bar_sprite.SetX(Math.Int(screen_width / 2 - 150));
                  bar_sprite.SetY(Math.Int(screen_height / 2 + 150));
                  bar_sprite.SetOpacity(1);
              }
              Plymouth.SetBootProgressFunction(boot_progress_cb);
              """)

          w(f"{A}/etc/plymouth/plymouthd.conf", """
              [Daemon]
              Theme=avalos
              ShowDelay=0
              """)

          print("Branding OK")
          BRANDPYEOF


      - name: Inyectar entradas de boot
        run: |
          set -u
          # ── systemd-boot entries (UEFI) ────────────────────────────────────
          LOADER_DIR="$BUILD_DIR/efiboot/loader/entries"
          mkdir -p "$LOADER_DIR"

          cat > "$LOADER_DIR/01-avalos.conf" << 'ENTRYEOF'
          title   AvalOS Live
          linux   /arch/boot/x86_64/vmlinuz-linux-avalos-compat
          initrd  /arch/boot/x86_64/initramfs-linux.img
          options archisobasedir=arch archisolabel=%ARCHISO_LABEL% quiet splash
          ENTRYEOF

          cat > "$LOADER_DIR/02-avalos-nomodeset.conf" << 'ENTRYEOF2'
          title   AvalOS Live (nomodeset — GPU con problemas)
          linux   /arch/boot/x86_64/vmlinuz-linux-avalos-compat
          initrd  /arch/boot/x86_64/initramfs-linux.img
          options archisobasedir=arch archisolabel=%ARCHISO_LABEL% nomodeset quiet splash
          ENTRYEOF2

          cat > "$BUILD_DIR/efiboot/loader/loader.conf" << 'LOADEREOF'
          default 01-avalos.conf
          timeout 8
          console-mode auto
          editor  no
          LOADEREOF

          # ── syslinux entries (BIOS legacy) ─────────────────────────────────
          SYSLINUX_DIR="$BUILD_DIR/syslinux"
          mkdir -p "$SYSLINUX_DIR"

          [[ -f /usr/share/archiso/configs/releng/syslinux/archiso_sys-linux.cfg ]] && \
            cp /usr/share/archiso/configs/releng/syslinux/*.cfg "$SYSLINUX_DIR/" 2>/dev/null || true

          cat > "$SYSLINUX_DIR/archiso_sys.cfg" << 'SYSEOF'
          DEFAULT avalos
          PROMPT 1
          TIMEOUT 80

          LABEL avalos
            MENU LABEL AvalOS Live
            LINUX /arch/boot/x86_64/vmlinuz-linux-avalos-compat
            INITRD /arch/boot/x86_64/initramfs-linux.img
            APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% quiet splash

          LABEL avalos-nomodeset
            MENU LABEL AvalOS Live (nomodeset)
            LINUX /arch/boot/x86_64/vmlinuz-linux-avalos-compat
            INITRD /arch/boot/x86_64/initramfs-linux.img
            APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% nomodeset quiet splash
          SYSEOF

          echo "Entradas de boot inyectadas (UEFI + BIOS)"

      - name: Construir ISO con mkarchiso
        timeout-minutes: 60
        run: |
          set -u
          BUILD_WORK="/tmp/avalos-iso-work"
          OUTPUT_DIR="/tmp/avalos-iso-output"
          mkdir -p "$BUILD_WORK" "$OUTPUT_DIR"

          echo "Iniciando mkarchiso..."
          mkarchiso -v -w "$BUILD_WORK" -o "$OUTPUT_DIR" "$BUILD_DIR"

          ISO_FILE=$(find "$OUTPUT_DIR" -name "*.iso" | head -1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "ERROR: ISO no generada"
            exit 1
          fi

          ISO_SIZE=$(du -sh "$ISO_FILE" | cut -f1)
          echo "ISO generada: $ISO_FILE ($ISO_SIZE)"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_ENV"
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_ENV"

          # SHA256
          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          echo "sha_file=${ISO_FILE}.sha256" >> "$GITHUB_ENV"

      - name: Publicar en GitHub Releases
        if: github.event.inputs.upload == 'true'
        run: |
          set -u
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="v${VERSION}"

          NOTES="## AvalOS ${VERSION}

          **Kernel:** ${{ steps.vars.outputs.kernel }}
          **Base:** Arch Linux (rolling)
          **Entorno:** Hyprland · Wayland · Tokyo Night

          ### Instalacion rapida
          1. Descarga la ISO
          2. Grabala en un USB con Ventoy o \`dd\`
          3. Arranca desde el USB
          4. El instalador grafico abre automaticamente
          5. Elige disco, usuario, contrasena, timezone → Instalar
          6. Reinicia sin el USB

          ### Checksums
          \`\`\`
          $(cat "$sha_file")
          \`\`\`"

          if gh release view "$TAG" --repo "${{ env.AVALOS_REPO }}" &>/dev/null; then
            echo "Actualizando release $TAG..."
            gh release upload "$TAG" "$iso_file" "$sha_file" \
              --repo "${{ env.AVALOS_REPO }}" --clobber
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" "$iso_file" "$sha_file" \
              --repo "${{ env.AVALOS_REPO }}" \
              --title "AvalOS ${VERSION}" \
              --notes "$NOTES"
          fi

          echo ""
          echo "Publicado en:"
          echo "https://github.com/${{ env.AVALOS_REPO }}/releases/tag/${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen
        if: always()
        run: |
          echo "## AvalOS ISO Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.vars.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel | ${{ steps.vars.outputs.kernel }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tamano | ${iso_size:-desconocido} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${iso_file:-}" ]]; then
            echo "Publicado en: https://github.com/${{ env.AVALOS_REPO }}/releases/tag/v${{ steps.vars.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
