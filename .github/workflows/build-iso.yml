name: Build AvalOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (vacio = fecha actual YYYY.MM.DD)"
        required: false
        default: ""
      upload:
        description: "Subir ISO a GitHub Releases"
        type: boolean
        default: true

env:
  AVALOS_REPO: jeffreysama/avalos
  AVALOS_REPO_URL: https://github.com/jeffreysama/avalos/releases/download/repo
  BUILD_DIR: /tmp/avalos-iso-profile

jobs:
  build-iso:
    name: Construir AvalOS ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Instalar dependencias base
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso \
            git curl wget \
            github-cli \
            python \
            squashfs-tools \
            dosfstools \
            mtools \
            libisoburn \
            erofs-utils \
            imagemagick \
            ttf-dejavu

      - name: Checkout del repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar repo [avalos] en pacman
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          echo "$GPG_PUBLIC_KEY" | pacman-key --add -
          GPG_FPR=$(echo "$GPG_PUBLIC_KEY" | gpg --with-colons --import-options show-only --import - 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')
          if [[ -z "$GPG_FPR" ]]; then
            echo "::error::No se pudo extraer el fingerprint desde el secret GPG_PUBLIC_KEY"
            exit 1
          fi
          echo "Fingerprint detectado: $GPG_FPR"
          pacman-key --lsign-key "$GPG_FPR"

          printf '\n[avalos]\nSigLevel = Required DatabaseOptional\nServer = https://github.com/jeffreysama/avalos/releases/download/repo\n' \
            >> /etc/pacman.conf
          pacman -Sy --noconfirm
          echo "Repo avalos configurado:"
          pacman -Si linux-avalos | grep -E "Name|Version" || echo "[WARN] linux-avalos no disponible aun"

      - name: Determinar version
        id: vars
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            [[ -z "$VERSION" ]] && VERSION=$(date +%Y.%m.%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          echo "kernel=linux (live) → linux-avalos o compat según CPU detectada" >> "$GITHUB_OUTPUT"
          echo "Kernel live: linux estándar | Post-instalación: linux-avalos/compat según CPU"

      - name: Preparar perfil archiso
        run: |
          set -u
          VERSION="${{ steps.vars.outputs.version }}"
          AIROOTFS="$BUILD_DIR/airootfs"

          mkdir -p "$BUILD_DIR"
          cp -r /usr/share/archiso/configs/releng/. "$BUILD_DIR/"

          # FIX: releng trae su propio airootfs/etc/mkinitcpio.d/linux.preset
          # (ALL_kver='/boot/vmlinuz-linux') pensado para el kernel "linux" estándar.
          # Como el live usa linux-avalos-compat, ese archivo queda apuntando a un
          # kernel que nunca se instala -> "must be readable" al construir el ISO.
          rm -f "$BUILD_DIR/airootfs/etc/mkinitcpio.d/linux.preset"

          printf '%s' "" | base64 -d > /tmp/pyprepyeof.py
          python3 /tmp/pyprepyeof.py "$BUILD_DIR" "$VERSION"

          cp /etc/pacman.conf "$BUILD_DIR/pacman.conf"
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' "$BUILD_DIR/pacman.conf"
          if ! grep -q '\[avalos\]' "$BUILD_DIR/pacman.conf"; then
            printf '\n[avalos]\nSigLevel = Required DatabaseOptional\nServer = https://github.com/jeffreysama/avalos/releases/download/repo\n' \
              >> "$BUILD_DIR/pacman.conf"
          fi
          if ! grep -q '^\[multilib\]' "$BUILD_DIR/pacman.conf"; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> "$BUILD_DIR/pacman.conf"
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "AIROOTFS=$AIROOTFS" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KERNEL=${{ steps.vars.outputs.kernel }}" >> "$GITHUB_ENV"

      - name: Generar packages.x86_64
        run: |
          set -u
          KERNEL="${{ steps.vars.outputs.kernel }}"
          printf '%s' "" | base64 -d > /tmp/pypkgpyeof.py
          python3 /tmp/pypkgpyeof.py "$BUILD_DIR/packages.x86_64" "$KERNEL"
          wc -l "$BUILD_DIR/packages.x86_64"

      - name: Configurar airootfs (scripts, configs, wallpaper)
        run: |
          set -u
          mkdir -p "$AIROOTFS/usr/local/bin"
          mkdir -p "$AIROOTFS/root/.config/hypr"
          mkdir -p "$AIROOTFS/root/.config/waybar"
          mkdir -p "$AIROOTFS/root/.config/kitty"
          mkdir -p "$AIROOTFS/root/.config/mako"
          mkdir -p "$AIROOTFS/etc/sddm.conf.d"
          mkdir -p "$AIROOTFS/etc/systemd/system/graphical.target.wants"
          mkdir -p "$AIROOTFS/etc/pacman.d"

          mkdir -p "$AIROOTFS/usr/share/avalos/configs"
          cp -r configs/. "$AIROOTFS/usr/share/avalos/configs/"

          printf '%s' "" | base64 -d > /tmp/pycfgpyeof.py
          python3 /tmp/pycfgpyeof.py "$AIROOTFS"

          cp /etc/pacman.d/mirrorlist "$AIROOTFS/etc/pacman.d/mirrorlist" 2>/dev/null || \
            echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' \
              > "$AIROOTFS/etc/pacman.d/mirrorlist"

          mkdir -p "$AIROOTFS/efi/EFI/Linux"
          mkdir -p "$AIROOTFS/boot"

          cp "$BUILD_DIR/pacman.conf" "$AIROOTFS/etc/pacman.conf"

          printf '%s' "" | base64 -d > "$AIROOTFS/root/customize_airootfs.sh"
          chmod 755 "$AIROOTFS/root/customize_airootfs.sh"

          ln -sf /usr/lib/systemd/system/sddm.service \
            "$AIROOTFS/etc/systemd/system/display-manager.service"
          ln -sf /usr/lib/systemd/system/sddm.service \
            "$AIROOTFS/etc/systemd/system/graphical.target.wants/sddm.service"

          if [[ -f "scripts/skill_instalar_usb.py" && -f "scripts/translations.py" ]]; then
            mkdir -p "$AIROOTFS/usr/share/avalos/installer"
            cp scripts/skill_instalar_usb.py \
               "$AIROOTFS/usr/share/avalos/installer/skill_instalar_usb.py"
            cp scripts/translations.py \
               "$AIROOTFS/usr/share/avalos/installer/translations.py"
            printf '%s' "IyEvYmluL2Jhc2gKZXhwb3J0IFBZVEhPTlBBVEg9Ii91c3Ivc2hhcmUvYXZhbG9zL2luc3RhbGxlciR7UFlUSE9OUEFUSDorOiRQWVRIT05QQVRIfSIKZXhlYyBweXRob24zIC91c3Ivc2hhcmUvYXZhbG9zL2luc3RhbGxlci9za2lsbF9pbnN0YWxhcl91c2IucHkgIiRAIgo=" | base64 -d > "$AIROOTFS/usr/local/bin/avalos-install"
            chmod 755 "$AIROOTFS/usr/local/bin/avalos-install"
            echo "Instalador copiado"
          else
            echo "[WARN] scripts/skill_instalar_usb.py o scripts/translations.py no encontrados — live sin instalador grafico"
          fi

          [[ -f "configs/hyprland/hyprpaper.conf" ]] && \
            cp configs/hyprland/hyprpaper.conf "$AIROOTFS/root/.config/hypr/hyprpaper.conf" || \
            printf 'wallpaper {\n    monitor =\n    path = ~/.config/hypr/wallpaper.png\n    fit_mode = cover\n}\nsplash = false\n' \
              > "$AIROOTFS/root/.config/hypr/hyprpaper.conf"

          mkdir -p "$AIROOTFS/root/.config/waybar"
          [[ -f "configs/waybar/config.jsonc" ]] && \
            cp configs/waybar/config.jsonc "$AIROOTFS/root/.config/waybar/config.jsonc" || \
            echo "[WARN] configs/waybar/config.jsonc no encontrado"
          [[ -f "configs/waybar/style.css" ]] && \
            cp configs/waybar/style.css "$AIROOTFS/root/.config/waybar/style.css" || \
            echo "[WARN] configs/waybar/style.css no encontrado"

          mkdir -p "$AIROOTFS/root/.config/rofi"
          [[ -f "configs/rofi/config.rasi" ]] && \
            cp configs/rofi/config.rasi "$AIROOTFS/root/.config/rofi/config.rasi" || true

          mkdir -p "$AIROOTFS/root/.config/rofi/scripts"
          if [[ -f "configs/rofi/powermenu.sh" ]]; then
            cp configs/rofi/powermenu.sh "$AIROOTFS/root/.config/rofi/scripts/powermenu.sh"
            chmod 755 "$AIROOTFS/root/.config/rofi/scripts/powermenu.sh"
          fi

          mkdir -p "$AIROOTFS/root/.config/mako"
          [[ -f "configs/mako/config" ]] && \
            cp configs/mako/config "$AIROOTFS/root/.config/mako/config" || true

          [[ -f "configs/hyprland/hyprland.lua" ]] && \
            cp configs/hyprland/hyprland.lua "$AIROOTFS/root/.config/hypr/hyprland.lua" || \
            echo "[WARN] configs/hyprland/hyprland.lua no encontrado"
          [[ -f "configs/kitty/kitty.conf" ]] && \
            cp configs/kitty/kitty.conf "$AIROOTFS/root/.config/kitty/kitty.conf" || \
            echo "[WARN] configs/kitty/kitty.conf no encontrado"

          mkdir -p "$AIROOTFS/etc/fastfetch" "$AIROOTFS/root/.config/fastfetch"

          printf '%s' "" | base64 -d > /tmp/pylogoonly.py
          python3 /tmp/pylogoonly.py "$AIROOTFS"

          if [[ -f "configs/fastfetch/config.jsonc" ]]; then
            cp configs/fastfetch/config.jsonc "$AIROOTFS/etc/fastfetch/config.jsonc"
            cp configs/fastfetch/config.jsonc "$AIROOTFS/root/.config/fastfetch/config.jsonc"
            echo "fastfetch config: usando versión del repo (configs/fastfetch/config.jsonc)"
          else
            echo "fastfetch config: repo no encontrado — usando versión base64 (fallback)"
            printf '%s' "" | base64 -d > /tmp/pyffpyeof.py
            python3 /tmp/pyffpyeof.py "$AIROOTFS"
          fi
          echo "airootfs configurado"

      - name: Branding completo (logo, os-release, wallpaper, SDDM, Plymouth)
        run: |
          set -u
          AIROOTFS="$BUILD_DIR/airootfs"
          LOGO_URL="https://raw.githubusercontent.com/${{ env.AVALOS_REPO }}/main/assets/AvalOS-logo.png"

          mkdir -p "$AIROOTFS/usr/share/pixmaps"
          if curl -fsSL "$LOGO_URL" -o "$AIROOTFS/usr/share/pixmaps/avalos-logo.png"; then
            echo "Logo: $(wc -c < "$AIROOTFS/usr/share/pixmaps/avalos-logo.png") bytes"
          else
            echo "[WARN] Logo no encontrado en repo — generando placeholder Tokyo Night..."
            convert -size 256x256 xc:"#0d0e17" \
              -fill "#7aa2f7" -gravity center \
              -font DejaVu-Sans -pointsize 80 -annotate 0 "A" \
              "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" \
              || convert -size 256x256 xc:"#0d0e17" \
                   "$AIROOTFS/usr/share/pixmaps/avalos-logo.png"
            echo "Logo placeholder generado"
          fi

          convert -size 1920x1080 xc:"#0d0e17" \
            \( "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" \
               -resize 260x260 -background none \) \
            -gravity center -geometry +0-100 -composite \
            -font "DejaVu-Sans" \
            -pointsize 64 -fill "#c0caf5" \
            -gravity center -annotate +0+75 "AvalOS" \
            -pointsize 20 -fill "#565f89" \
            -gravity center -annotate +0+135 "An Arch-based Distro" \
            "$AIROOTFS/root/.config/hypr/wallpaper.png" \
            && echo "Wallpaper: logo + texto OK" \
            || { convert -size 1920x1080 xc:"#0d0e17" \
                   "$AIROOTFS/root/.config/hypr/wallpaper.png"
                 echo "Fallback: wallpaper solido negro profundo"; }

          mkdir -p "$AIROOTFS/usr/share/avalos"
          cp "$AIROOTFS/root/.config/hypr/wallpaper.png" "$AIROOTFS/usr/share/avalos/wallpaper-default.png"

          printf '%s' "" | base64 -d > /tmp/pybrandpyeof.py
          python3 /tmp/pybrandpyeof.py "$AIROOTFS"

      - name: Inyectar entradas de boot
        run: |
          set -u
          LOADER_DIR="$BUILD_DIR/efiboot/loader/entries"
          mkdir -p "$LOADER_DIR"

          rm -f "$LOADER_DIR/"*.conf

          printf '%s' "dGl0bGUgICBBdmFsT1MgTGl2ZQpsaW51eCAgIC9hcmNoL2Jvb3QveDg2XzY0L3ZtbGludXotbGludXgKaW5pdHJkICAvYXJjaC9ib290L3g4Nl82NC9pbml0cmFtZnMtbGludXguaW1nCm9wdGlvbnMgYXJjaGlzb2Jhc2VkaXI9YXJjaCBhcmNoaXNvbGFiZWw9JUFSQ0hJU09fTEFCRUwlIHF1aWV0IHNwbGFzaAo=" | base64 -d > "$LOADER_DIR/01-avalos.conf"

          printf '%s' "dGl0bGUgICBBdmFsT1MgTGl2ZSAobm9tb2Rlc2V0IOKAlCBHUFUgY29uIHByb2JsZW1hcykKbGludXggICAvYXJjaC9ib290L3g4Nl82NC92bWxpbnV6LWxpbnV4CmluaXRyZCAgL2FyY2gvYm9vdC94ODZfNjQvaW5pdHJhbWZzLWxpbnV4LmltZwpvcHRpb25zIGFyY2hpc29iYXNlZGlyPWFyY2ggYXJjaGlzb2xhYmVsPSVBUkNISVNPX0xBQkVMJSBub21vZGVzZXQgcXVpZXQgc3BsYXNoCg==" | base64 -d > "$LOADER_DIR/02-avalos-nomodeset.conf"

          printf '%s' "ZGVmYXVsdCAwMS1hdmFsb3MuY29uZgp0aW1lb3V0IDgKY29uc29sZS1tb2RlIGF1dG8KZWRpdG9yICBubwo=" | base64 -d > "$BUILD_DIR/efiboot/loader/loader.conf"

          SYSLINUX_DIR="$BUILD_DIR/syslinux"
          mkdir -p "$SYSLINUX_DIR"

          [[ -f /usr/share/archiso/configs/releng/syslinux/archiso_sys-linux.cfg ]] && \
            cp /usr/share/archiso/configs/releng/syslinux/*.cfg "$SYSLINUX_DIR/" 2>/dev/null || true

          printf '%s' "" | base64 -d > "$SYSLINUX_DIR/archiso_sys.cfg"

          echo "Entradas de boot inyectadas (UEFI + BIOS)"

      - name: Construir ISO con mkarchiso
        timeout-minutes: 60
        run: |
          set -u
          BUILD_WORK="/tmp/avalos-iso-work"
          OUTPUT_DIR="/tmp/avalos-iso-output"
          mkdir -p "$BUILD_WORK" "$OUTPUT_DIR"

          echo "=== Kernel en packages.x86_64 (debe ser linux-avalos-compat, nunca avalos/bore) ==="
          grep -E "^linux-avalos" "$BUILD_DIR/packages.x86_64" || echo "[WARN] no se encontró ningún linux-avalos* — revisar pypkgpyeof.py"

          IGNORE_LINE="IgnorePkg = linux-avalos linux-avalos-headers linux-avalos-bore linux-avalos-bore-headers"
          if grep -q "^IgnorePkg" "$BUILD_DIR/pacman.conf"; then
            sed -i "s/^IgnorePkg.*/${IGNORE_LINE}/" "$BUILD_DIR/pacman.conf"
          elif grep -q "^#IgnorePkg" "$BUILD_DIR/pacman.conf"; then
            sed -i "s/^#IgnorePkg.*/${IGNORE_LINE}/" "$BUILD_DIR/pacman.conf"
          else
            echo "$IGNORE_LINE" >> "$BUILD_DIR/pacman.conf"
          fi
          echo "=== IgnorePkg en pacman.conf ==="
          grep "IgnorePkg" "$BUILD_DIR/pacman.conf"

          echo "Iniciando mkarchiso..."
          mkarchiso -v -w "$BUILD_WORK" -o "$OUTPUT_DIR" "$BUILD_DIR"

          ISO_FILE=$(find "$OUTPUT_DIR" -name "*.iso" | head -1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "ERROR: ISO no generada"
            exit 1
          fi

          ISO_SIZE=$(du -sh "$ISO_FILE" | cut -f1)
          echo "ISO generada: $ISO_FILE ($ISO_SIZE)"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_ENV"
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_ENV"

          echo "=== Verificando kernel en boot dir de la ISO ==="
          VMLINUZ_ISO=$(find "$BUILD_WORK" -name "vmlinuz-linux" 2>/dev/null | head -1)
          if [[ -n "$VMLINUZ_ISO" ]]; then
            echo "✓ vmlinuz-linux encontrado en: $VMLINUZ_ISO"
          else
            echo "[WARN] vmlinuz-linux NO encontrado en work dir — revisar packages.x86_64"
            find "$BUILD_WORK" -name "vmlinuz*" 2>/dev/null || echo "  (ninguno)"
          fi

          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          echo "sha_file=${ISO_FILE}.sha256" >> "$GITHUB_ENV"

      - name: Publicar en GitHub Releases
        if: github.event.inputs.upload != 'false'
        env:
          ISO_FILE: ${{ env.iso_file }}
          SHA_FILE: ${{ env.sha_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="v${VERSION}"

          NOTES="## AvalOS ${VERSION}

          **Kernel live:** linux (estándar Arch) · Post-instalación: linux-avalos o linux-avalos-compat según CPU
          **Base:** Arch Linux (rolling)
          **Entorno:** Hyprland · Wayland · Tokyo Night

          1. Descarga la ISO
          2. Grabala en un USB con Ventoy o \`dd\`
          3. Arranca desde el USB
          4. El instalador grafico abre automaticamente
          5. Elige disco, usuario, contrasena, timezone → Instalar
          6. Reinicia sin el USB

          \`\`\`
          $(cat "$SHA_FILE")
          \`\`\`"

          if gh release view "$TAG" --repo "${{ env.AVALOS_REPO }}" &>/dev/null; then
            echo "Actualizando release $TAG..."
            gh release upload "$TAG" "$ISO_FILE" "$SHA_FILE" \
              --repo "${{ env.AVALOS_REPO }}" --clobber
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" "$ISO_FILE" "$SHA_FILE" \
              --repo "${{ env.AVALOS_REPO }}" \
              --title "AvalOS ${VERSION}" \
              --notes "$NOTES"
          fi

          echo ""
          echo "Publicado en:"
          echo "https://github.com/${{ env.AVALOS_REPO }}/releases/tag/${TAG}"

      - name: Resumen
        if: always()
        run: |
          echo "## AvalOS ISO Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.vars.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel live | linux (estándar Arch) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel instalado | linux-avalos / linux-avalos-compat (detectado por instalador) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tamano | ${iso_size:-desconocido} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${iso_file:-}" ]]; then
            echo "Publicado en: https://github.com/${{ env.AVALOS_REPO }}/releases/tag/v${{ steps.vars.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
