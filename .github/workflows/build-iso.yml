name: Build AvalOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (vacio = fecha actual YYYY.MM.DD)"
        required: false
        default: ""
      kernel:
        description: "Kernel a usar (linux-avalos / linux-avalos-compat / linux)"
        required: false
        default: "linux-avalos"
      upload:
        description: "Subir ISO a GitHub Releases"
        type: boolean
        default: true

env:
  GITHUB_REPO: jeffreysama/avalos
  AVALOS_REPO_URL: https://github.com/jeffreysama/avalos/releases/download/repo

jobs:
  build-iso:
    name: Construir AvalOS ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Instalar dependencias base
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso \
            git curl wget \
            github-cli \
            python \
            squashfs-tools \
            dosfstools \
            mtools \
            libisoburn \
            erofs-utils
            imagemagick

      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar repo [avalos] en pacman
        run: |
          # Inyectar el repo avalos para que mkarchiso pueda descargar linux-avalos
          cat >> /etc/pacman.conf << 'EOF'

          [avalos]
          SigLevel = Optional TrustAll
          Server = https://github.com/jeffreysama/avalos/releases/download/repo
          EOF
          pacman -Sy --noconfirm
          echo "Repo avalos configurado:"
          pacman -Si linux-avalos | grep -E "Name|Version" || echo "[WARN] linux-avalos no disponible aun"

      - name: Determinar version y kernel
        id: vars
        run: |
          # Version
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Intentar desde git tag
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            [[ -z "$VERSION" ]] && VERSION=$(date +%Y.%m.%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          # Kernel
          KERNEL="${{ github.event.inputs.kernel }}"
          [[ -z "$KERNEL" ]] && KERNEL="linux-avalos"

          # Verificar disponibilidad del kernel elegido
          if ! pacman -Si "$KERNEL" &>/dev/null; then
            echo "[WARN] $KERNEL no disponible en repos - usando linux como fallback"
            KERNEL="linux"
          fi
          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "Kernel: $KERNEL"

      - name: Preparar perfil archiso
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          KERNEL="${{ steps.vars.outputs.kernel }}"
          BUILD_DIR="/tmp/avalos-iso-build"
          AIROOTFS="$BUILD_DIR/airootfs"

          mkdir -p "$BUILD_DIR"
          cp -r /usr/share/archiso/configs/releng/. "$BUILD_DIR/"

          # profiledef.sh
          cat > "$BUILD_DIR/profiledef.sh" << PROFILEEOF
          #!/usr/bin/env bash
          iso_name="avalos-${VERSION}"
          iso_label="AVLS_${VERSION//./_}"
          iso_publisher="AvalOS <https://github.com/jeffreysama/avalos>"
          iso_application="AvalOS — Arch-based · Hyprland · Tokyo Night"
          iso_version="${VERSION}"
          install_dir="arch"
          buildmodes=('iso')
          bootmodes=('bios.syslinux' 'uefi.systemd-boot')
          arch="x86_64"
          pacman_conf="pacman.conf"
          airootfs_image_type="squashfs"
          airootfs_image_tool_options=('-comp' 'zstd' '-Xcompression-level' '19' '-b' '1M')
          bootstrap_tarball_compression=('zstd' '-c' '-T0' '--auto-threads=logical' '--long' '-19')
          file_permissions=(
            ["/etc/shadow"]="0:0:400"
            ["/etc/gshadow"]="0:0:400"
            ["/root"]="0:0:750"
            ["/usr/local/bin/avalos-install"]="0:0:755"
            ["/usr/local/bin/avalos-gpu-env"]="0:0:755"
          )
          PROFILEEOF

          # pacman.conf del ISO — incluye repo avalos
          cp /etc/pacman.conf "$BUILD_DIR/pacman.conf"
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' "$BUILD_DIR/pacman.conf"
          # Asegurar que el repo avalos esté en el pacman.conf del ISO
          if ! grep -q '\[avalos\]' "$BUILD_DIR/pacman.conf"; then
            printf '\n[avalos]\nSigLevel = Optional TrustAll\nServer = https://github.com/jeffreysama/avalos/releases/download/repo\n' >> "$BUILD_DIR/pacman.conf"
          fi
          # Sin nvidia
          sed -i '/^[options]/a IgnorePkg = linux-firmware-nvidia' "$BUILD_DIR/pacman.conf"
          # Habilitar multilib para paquetes lib32
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> "$BUILD_DIR/pacman.conf"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "AIROOTFS=$AIROOTFS" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"

      - name: Generar packages.x86_64
        run: |
          KERNEL="${{ steps.vars.outputs.kernel }}"

          cat > "$BUILD_DIR/packages.x86_64" << PKGEOF
          # Kernel
          ${KERNEL}
          linux-firmware-amdgpu
          linux-firmware-radeon
          linux-firmware-intel
          linux-firmware-atheros
          linux-firmware-realtek
          linux-firmware-whence
          linux-firmware-bnx2x
          linux-firmware-qcom

          # Base
          base
          base-devel
          sudo
          bash
          bash-completion

          # Entorno grafico Hyprland
          hyprland
          hyprpaper
          waybar
          wofi
          kitty
          sddm
          qt5-graphicaleffects
          plymouth
          qt5-wayland
          qt6-wayland
          polkit-kde-agent
          xdg-desktop-portal-hyprland
          xdg-desktop-portal-gtk

          # Audio
          pipewire
          pipewire-pulse
          pipewire-alsa
          wireplumber

          # Drivers GPU AMD (primera clase)
          mesa
          vulkan-radeon
          libva-mesa-driver
          lib32-mesa
          lib32-vulkan-radeon

          # Drivers GPU Intel (soporte completo)
          vulkan-intel
          intel-media-driver
          libva-intel-driver
          lib32-vulkan-intel

          # Fuentes y temas
          ttf-jetbrains-mono-nerd
          ttf-nerd-fonts-symbols
          noto-fonts
          noto-fonts-emoji

          # Herramientas live
          networkmanager
          nm-connection-editor
          git
          curl
          wget
          python
          python-pip
          python-pywebview
          fastfetch
          htop
          nano
          vim
          grim
          slurp
          wl-clipboard
          xdg-utils
          udisks2
          udiskie
          gvfs
          thunar
          file-roller
          firefox

          # Herramientas de instalacion
          arch-install-scripts
          parted
          dosfstools
          e2fsprogs
          btrfs-progs
          gptfdisk

          # archiso (para el live)
          archiso
          syslinux
          edk2-shell
          PKGEOF

          echo "packages.x86_64 generado"
          wc -l "$BUILD_DIR/packages.x86_64"

      - name: Configurar airootfs (scripts, configs, wallpaper)
        run: |
          mkdir -p "$AIROOTFS/usr/local/bin"
          mkdir -p "$AIROOTFS/root/.config/hypr"
          mkdir -p "$AIROOTFS/root/.config/waybar"
          mkdir -p "$AIROOTFS/root/.config/kitty"
          mkdir -p "$AIROOTFS/root/.config/hypr"
          mkdir -p "$AIROOTFS/etc/sddm.conf.d"
          mkdir -p "$AIROOTFS/etc/systemd/system/graphical.target.wants"
          mkdir -p "$AIROOTFS/etc/pacman.d"

          # Preset de mkinitcpio para linux-avalos con soporte archiso
          # Sobrescribe el preset instalado por el paquete para:
          #   1. Eliminar la línea default_uki (requiere /efi que no existe en chroot)
          #   2. Agregar el preset 'archiso' que genera /boot/initramfs-linux.img
          #      (mkarchiso busca exactamente ese archivo)
          mkdir -p "$AIROOTFS/etc/mkinitcpio.d"
          cat > "$AIROOTFS/etc/mkinitcpio.d/linux-avalos.preset" << 'PRESETEOF'
          ALL_config='/etc/mkinitcpio.conf'
          ALL_kver='/boot/vmlinuz-linux-avalos'
          PRESETS=('default' 'fallback' 'archiso')

          default_image='/boot/initramfs-linux-avalos.img'
          fallback_image='/boot/initramfs-linux-avalos-fallback.img'
          fallback_options='-S autodetect'

          archiso_config='/etc/mkinitcpio.conf.d/archiso.conf'
          archiso_image='/boot/initramfs-linux.img'
          PRESETEOF
          cp /etc/pacman.d/mirrorlist "$AIROOTFS/etc/pacman.d/mirrorlist" 2>/dev/null || \
            echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' \
              > "$AIROOTFS/etc/pacman.d/mirrorlist"

          # archiso.conf: hooks mínimos para el initramfs del live
          mkdir -p "$AIROOTFS/etc/mkinitcpio.conf.d"
          cat > "$AIROOTFS/etc/mkinitcpio.conf.d/archiso.conf" << 'ARCHISOCONF'
          HOOKS=(base systemd keyboard sd-vconsole block filesystems)
          COMPRESSION="zstd"
          ARCHISOCONF

          # Crear /efi y /boot para que mkinitcpio no falle en chroot
          mkdir -p "$AIROOTFS/efi/EFI/Linux"
          mkdir -p "$AIROOTFS/boot"

          # Symlink: mkarchiso espera /boot/vmlinuz-linux para el preset archiso
          # Apuntarlo al kernel linux-avalos
          ln -sf vmlinuz-linux-avalos "$AIROOTFS/boot/vmlinuz-linux" 2>/dev/null || true

          # pacman.conf dentro del airootfs
          cp "$BUILD_DIR/pacman.conf" "$AIROOTFS/etc/pacman.conf"

          # Copiar instalador si existe en el repo
          if [[ -f "skill_instalar_usb.py" ]]; then
            cp skill_instalar_usb.py "$AIROOTFS/usr/local/bin/avalos-install"
            chmod 755 "$AIROOTFS/usr/local/bin/avalos-install"
            echo "Instalador copiado"
          else
            echo "[WARN] skill_instalar_usb.py no encontrado — live sin instalador grafico"
          fi

          # avalos-gpu-env
          cat > "$AIROOTFS/usr/local/bin/avalos-gpu-env" << 'GPUEOF'
          #!/bin/bash
          HYPR_CFG="$HOME/.config/hypr/gpu-env.conf"
          mkdir -p "$(dirname "$HYPR_CFG")"
          if lspci 2>/dev/null | grep -qiE 'amd|radeon|amdgpu'; then
              printf 'env = AMD_VULKAN_ICD,RADV\nenv = VDPAU_DRIVER,radeonsi\nenv = LIBVA_DRIVER_NAME,radeonsi\n' > "$HYPR_CFG"
          elif lspci 2>/dev/null | grep -qiE 'intel.*(graphics|vga|display)'; then
              printf 'env = LIBVA_DRIVER_NAME,iHD\nenv = VDPAU_DRIVER,va_gl\n' > "$HYPR_CFG"
          else
              : > "$HYPR_CFG"
          fi
          GPUEOF
          chmod 755 "$AIROOTFS/usr/local/bin/avalos-gpu-env"

          # gpu-detect service (corre antes de SDDM)
          cat > "$AIROOTFS/etc/systemd/system/avalos-gpu-detect.service" << 'SVCEOF'
          [Unit]
          Description=AvalOS GPU Environment Detection
          Before=sddm.service display-manager.service
          After=systemd-udev-settle.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/avalos-gpu-env
          RemainAfterExit=yes

          [Install]
          WantedBy=graphical.target
          SVCEOF
          ln -sf /etc/systemd/system/avalos-gpu-detect.service \
              "$AIROOTFS/etc/systemd/system/graphical.target.wants/avalos-gpu-detect.service"

          # SDDM autologin root en live
          cat > "$AIROOTFS/etc/sddm.conf.d/autologin.conf" << 'SDDMEOF'
          [Autologin]
          User=root
          Session=hyprland
          SDDMEOF

          # Wallpaper: fondo Tokyo Night sólido (el branding step lo sobreescribe con logo)
          convert -size 1920x1080 xc:"#1a1b26" "$AIROOTFS/root/.config/hypr/wallpaper.png"

          # hyprpaper.conf
          cat > "$AIROOTFS/root/.config/hypr/hyprpaper.conf" << 'HYPRPAPEREOF'
          preload = ~/.config/hypr/wallpaper.png
          wallpaper = ,~/.config/hypr/wallpaper.png
          splash = false
          HYPRPAPEREOF

          # gpu-env.conf vacio (se sobreescribe por el servicio antes de Hyprland)
          touch "$AIROOTFS/root/.config/hypr/gpu-env.conf"

          # hyprland.conf del live
          cat > "$AIROOTFS/root/.config/hypr/hyprland.conf" << 'HYPREOF'
          # AvalOS Live — Hyprland config
          source = ~/.config/hypr/gpu-env.conf

          monitor = ,preferred,auto,1

          exec-once = /usr/local/bin/avalos-gpu-env
          exec-once = hyprpaper
          exec-once = waybar
          exec-once = python /usr/local/bin/avalos-install

          general {
              gaps_in = 4
              gaps_out = 8
              border_size = 2
              col.active_border = rgba(7aa2f7ff)
              col.inactive_border = rgba(1a1b26ff)
          }

          decoration {
              rounding = 8
              blur { enabled = true; size = 6; passes = 3 }
          }

          input {
              kb_layout = latam
              follow_mouse = 1
              touchpad { natural_scroll = true }
          }

          bind = SUPER, Return, exec, kitty
          bind = SUPER, Q, killactive
          bind = SUPER, Space, exec, wofi --show drun
          bind = SUPER SHIFT, E, exit
          HYPREOF

          # kitty.conf minimal
          cat > "$AIROOTFS/root/.config/kitty/kitty.conf" << 'KITTYEOF'
          font_family JetBrainsMono Nerd Font
          font_size 12.0
          background #1a1b26
          foreground #c0caf5
          KITTYEOF

          # sysctl BBR
          mkdir -p "$AIROOTFS/etc/sysctl.d"
          cat > "$AIROOTFS/etc/sysctl.d/80-avalos-bbr.conf" << 'BBREOF'
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          BBREOF


          # Fastfetch — logo AvalOS + Tokyo Night
          mkdir -p "$AIROOTFS/etc/fastfetch"
          mkdir -p "$AIROOTFS/root/.config/fastfetch"

          cat > "$AIROOTFS/etc/fastfetch/avalos.txt" << 'LOGOEOF'
$1                          ʌ
$1                         /#\
$1                        /#$2@$1#\
$1                       /#$2@$3$$$2@$1#\
$1                ___   /#$3$$$2@$1ʌ$2@$3$$$1#\    ___
$1                \$4&&$1\ /#$3$$$2@$1/$3$$$1\$2@$1##\  /$4&&$1/
$1                 \$4&&$1\#$3$$$2@$1/$3$$$$$$$1\$2@$1##\/$4&&$1/
$1                  \$4&&$1\$2@$1/$3$$$$$1ʌ$3$$$$$1\$2@$3$$$1#\$4&$1/
$1                  /\$4&&$1\$3$$$$$1/ \$3$$$$$1\$2@$3$$$1#\
$1                 /#$3$$$1\$4&&$1\/   \$3$$$$$1\$2@$3$$$1#\
$1                /#$3$$$2@$1/\$4&&$1\    \$3$$$$$1\$2@$3$$$1#\
$1               /#$3$$$2@$1/$3$$$$$1\$4&&$1\  /$4&$1\$3$$$$$1\$2@$3$$$1#\
$1              /#$3$$$2@$1/$3$$$$$1/ \$4&&$1\/$4&&$1/\$3$$$$$1\$2@$3$$$1#\
$1             /#$3$$$2@$1/$3$$$$$1/   \$4&&&&$1/  \$3$$$$$1\$2@$3$$$1#\
$1             \#$3$$$1/$3$$$$$1/     \$4&&$1/    \$3$$$$$1\$2@$3$$$1/
$1              \/__/       \/      \__\/
LOGOEOF

          cat > "$AIROOTFS/root/.config/fastfetch/config.jsonc" << 'FFEOF'
{
  "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
  "logo": {
    "source": "/etc/fastfetch/avalos.txt",
    "colors": [
      "38;2;122;162;247",
      "38;2;125;207;255",
      "38;2;187;154;247",
      "38;2;158;206;106"
    ],
    "padding": { "top": 1, "right": 2 }
  },
  "display": {
    "separator": " → ",
    "color": {
      "keys":   "38;2;122;162;247",
      "title":  "38;2;125;207;255",
      "output": "38;2;192;202;245"
    }
  },
  "modules": [
    { "type": "title",    "format": "{user-name}@{host-name}" },
    "separator",
    { "type": "os",       "key": " OS",          "format": "AvalOS ({distro-id})" },
    { "type": "host",     "key": "󰇄 Host"                                         },
    { "type": "kernel",   "key": " Kernel"                                        },
    { "type": "uptime",   "key": "󰔟 Uptime"                                       },
    { "type": "packages", "key": "󰏗 Paquetes"                                     },
    { "type": "shell",    "key": " Shell"                                         },
    { "type": "display",  "key": "󰍹 Resolución"                                   },
    { "type": "wm",       "key": " WM"                                            },
    { "type": "terminal", "key": " Terminal"                                      },
    "separator",
    { "type": "cpu",    "key": " CPU",    "showPeCoreCount": true, "temp": true   },
    { "type": "gpu",    "key": "󰿵 GPU",   "temp": true                            },
    { "type": "memory", "key": "󰍛 RAM"                                             },
    { "type": "disk",   "key": "󰋊 Disco",  "folders": "/"                          },
    "separator",
    { "type": "colors", "paddingLeft": 2, "symbol": "circle"                     }
  ]
}
FFEOF

          echo "airootfs configurado"


      - name: Branding completo (logo, os-release, wallpaper, SDDM, Plymouth)
        run: |
          AIROOTFS="$BUILD_DIR/airootfs"
          LOGO_URL="https://raw.githubusercontent.com/${{ env.GITHUB_REPO }}/main/AvalOS-logo.png"

          # ── Logo: descargarlo al airootfs ─────────────────────────────────
          mkdir -p "$AIROOTFS/usr/share/pixmaps"
          curl -fsSL "$LOGO_URL" -o "$AIROOTFS/usr/share/pixmaps/avalos-logo.png"
          echo "Logo descargado: $(wc -c < "$AIROOTFS/usr/share/pixmaps/avalos-logo.png") bytes"

          # ── os-release ────────────────────────────────────────────────────
          cat > "$AIROOTFS/etc/os-release" << 'OSEOF'
NAME="AvalOS"
PRETTY_NAME="AvalOS"
ID=avalos
ID_LIKE=arch
HOME_URL="https://github.com/jeffreysama/avalos"
SUPPORT_URL="https://github.com/jeffreysama/avalos/issues"
BUG_REPORT_URL="https://github.com/jeffreysama/avalos/issues"
LOGO=avalos-logo
BUILD_ID=rolling
ANSI_COLOR="38;2;122;162;247"
OSEOF

          # ── Wallpaper: fondo Tokyo Night + logo centrado ─────────────────
          convert -size 1920x1080 xc:"#1a1b26" \
            \( "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" \
               -resize 380x380 \
               -background none \) \
            -gravity center -geometry +0-80 \
            -composite "$AIROOTFS/root/.config/hypr/wallpaper.png" \
            && echo "Wallpaper con logo generado" \
            || echo "Fallback: wallpaper solido Tokyo Night"

          # ── SDDM: tema AvalOS Tokyo Night ─────────────────────────────────
          SDDM_THEME="$AIROOTFS/usr/share/sddm/themes/avalos"
          mkdir -p "$SDDM_THEME"

          # Copiar logo al tema
          cp "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" "$SDDM_THEME/avalos-logo.png"

          # theme.conf
          cat > "$SDDM_THEME/theme.conf" << 'THEMEEOF'
[General]
type=theme
name=AvalOS
description=AvalOS — Tokyo Night
author=AvalOS
license=MIT
THEMEEOF

          # Main.qml
          cat > "$SDDM_THEME/Main.qml" << 'QMLEOF'
import QtQuick 2.15
import QtQuick.Controls 2.15
import QtQuick.Layouts 1.15

Item {
    id: root

    Rectangle {
        anchors.fill: parent
        color: "#1a1b26"
    }

    ColumnLayout {
        anchors.centerIn: parent
        spacing: 18
        width: 300

        Image {
            Layout.alignment: Qt.AlignHCenter
            source: Qt.resolvedUrl("avalos-logo.png")
            width: 140; height: 140
            fillMode: Image.PreserveAspectFit
            smooth: true
        }

        Text {
            Layout.alignment: Qt.AlignHCenter
            text: "AvalOS"
            color: "#7aa2f7"
            font.pixelSize: 30
            font.weight: Font.Light
        }

        Item { Layout.preferredHeight: 8 }

        TextField {
            id: nameField
            Layout.fillWidth: true
            text: userModel.lastUser
            placeholderText: "Usuario"
            color: "#c0caf5"
            placeholderTextColor: "#565f89"
            font.pixelSize: 13
            leftPadding: 14; rightPadding: 14
            topPadding: 10; bottomPadding: 10
            background: Rectangle {
                color: "#24283b"
                radius: 8
                border.color: nameField.activeFocus ? "#7aa2f7" : "#414868"
                border.width: 1
            }
            KeyNavigation.tab: passField
        }

        TextField {
            id: passField
            Layout.fillWidth: true
            placeholderText: "Contraseña"
            echoMode: TextInput.Password
            color: "#c0caf5"
            placeholderTextColor: "#565f89"
            font.pixelSize: 13
            leftPadding: 14; rightPadding: 14
            topPadding: 10; bottomPadding: 10
            background: Rectangle {
                color: "#24283b"
                radius: 8
                border.color: passField.activeFocus ? "#7aa2f7" : "#414868"
                border.width: 1
            }
            Keys.onReturnPressed: doLogin()
            KeyNavigation.tab: loginBtn
        }

        Text {
            Layout.fillWidth: true
            text: sddm.lastError
            color: "#f7768e"
            font.pixelSize: 11
            wrapMode: Text.WordWrap
            visible: sddm.lastError !== ""
        }

        Button {
            id: loginBtn
            Layout.fillWidth: true
            text: "Iniciar sesión"
            topPadding: 10; bottomPadding: 10
            onClicked: doLogin()
            Keys.onReturnPressed: doLogin()
            background: Rectangle {
                color: loginBtn.pressed ? "#5a7fd4"
                     : loginBtn.hovered ? "#8aade7"
                     : "#7aa2f7"
                radius: 8
                Behavior on color { ColorAnimation { duration: 100 } }
            }
            contentItem: Text {
                text: loginBtn.text
                color: "#1a1b26"
                font.pixelSize: 13
                font.weight: Font.Medium
                horizontalAlignment: Text.AlignHCenter
                verticalAlignment: Text.AlignVCenter
            }
        }
    }

    ComboBox {
        id: sessionSelect
        anchors { right: parent.right; bottom: parent.bottom; margins: 20 }
        width: 170
        model: sessionModel
        textRole: "name"
        background: Rectangle {
            color: "#24283b"; radius: 6
            border.color: "#414868"
        }
        contentItem: Text {
            leftPadding: 10
            text: sessionSelect.displayText
            color: "#c0caf5"
            font.pixelSize: 12
            verticalAlignment: Text.AlignVCenter
        }
        popup.background: Rectangle {
            color: "#24283b"
            border.color: "#414868"
            radius: 6
        }
    }

    function doLogin() {
        sddm.login(nameField.text, passField.text, sessionSelect.currentIndex)
    }
}
QMLEOF

          # Activar tema en sddm.conf.d
          cat > "$AIROOTFS/etc/sddm.conf.d/theme.conf" << 'THEOF'
[Theme]
Current=avalos
THEOF

          # ── Plymouth: tema AvalOS ──────────────────────────────────────────
          PLY_THEME="$AIROOTFS/usr/share/plymouth/themes/avalos"
          mkdir -p "$PLY_THEME"
          mkdir -p "$AIROOTFS/etc/plymouth"

          # Copiar logo al tema
          cp "$AIROOTFS/usr/share/pixmaps/avalos-logo.png" "$PLY_THEME/avalos-logo.png"

          # avalos.plymouth
          cat > "$PLY_THEME/avalos.plymouth" << 'PLYEOF'
[Plymouth Theme]
Name=AvalOS
Description=AvalOS boot splash — Tokyo Night
ModuleName=script

[script]
ImageDir=/usr/share/plymouth/themes/avalos
ScriptFile=/usr/share/plymouth/themes/avalos/avalos.script
PLYEOF

          # avalos.script
          cat > "$PLY_THEME/avalos.script" << 'SCRIPTEOF'
# AvalOS Plymouth — Tokyo Night
screen_width  = Window.GetWidth();
screen_height = Window.GetHeight();

Window.SetBackgroundTopColor(0.102, 0.106, 0.149);
Window.SetBackgroundBottomColor(0.102, 0.106, 0.149);

logo_image  = Image("avalos-logo.png");
logo_image  = logo_image.Scale(260, 260);
logo_sprite = Sprite(logo_image);
logo_sprite.SetX(Math.Int(screen_width  / 2 - 130));
logo_sprite.SetY(Math.Int(screen_height / 2 - 150));
logo_sprite.SetOpacity(1);

# Barra de progreso
bar_bg_image = Image(300, 6);
bar_bg_sprite = Sprite(bar_bg_image);
bar_bg_sprite.SetX(Math.Int(screen_width / 2 - 150));
bar_bg_sprite.SetY(Math.Int(screen_height / 2 + 150));

fun boot_progress_cb(duration, progress) {
    bar_w = Math.Int(300 * progress);
    if (bar_w < 2) bar_w = 2;
    bar_image  = Image(bar_w, 6);
    bar_sprite = Sprite(bar_image);
    bar_sprite.SetX(Math.Int(screen_width / 2 - 150));
    bar_sprite.SetY(Math.Int(screen_height / 2 + 150));
    bar_sprite.SetOpacity(1);
}
Plymouth.SetBootProgressFunction(boot_progress_cb);
SCRIPTEOF

          # plymouthd.conf: tema por defecto
          cat > "$AIROOTFS/etc/plymouth/plymouthd.conf" << 'PLYDEOF'
[Daemon]
Theme=avalos
ShowDelay=0
PLYDEOF

          echo "Branding completo OK"

      - name: Construir ISO con mkarchiso
        run: |
          BUILD_WORK="/tmp/avalos-iso-work"
          OUTPUT_DIR="/tmp/avalos-iso-output"
          mkdir -p "$BUILD_WORK" "$OUTPUT_DIR"

          echo "Iniciando mkarchiso..."
          mkarchiso -v -w "$BUILD_WORK" -o "$OUTPUT_DIR" "$BUILD_DIR"

          ISO_FILE=$(find "$OUTPUT_DIR" -name "*.iso" | head -1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "ERROR: ISO no generada"
            exit 1
          fi

          ISO_SIZE=$(du -sh "$ISO_FILE" | cut -f1)
          echo "ISO generada: $ISO_FILE ($ISO_SIZE)"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_ENV"
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_ENV"

          # SHA256
          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          echo "sha_file=${ISO_FILE}.sha256" >> "$GITHUB_ENV"

      - name: Publicar en GitHub Releases
        if: github.event.inputs.upload != 'false'
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="v${VERSION}"

          NOTES="## AvalOS ${VERSION}

          **Kernel:** ${{ steps.vars.outputs.kernel }}
          **Base:** Arch Linux (rolling)
          **Entorno:** Hyprland · Wayland · Tokyo Night

          ### Instalacion rapida
          1. Descarga la ISO
          2. Grabala en un USB con Ventoy o \`dd\`
          3. Arranca desde el USB
          4. El instalador grafico abre automaticamente
          5. Elige disco, usuario, contrasena, timezone → Instalar
          6. Reinicia sin el USB

          ### Checksums
          \`\`\`
          $(cat "$sha_file")
          \`\`\`"

          if gh release view "$TAG" --repo "${{ env.GITHUB_REPO }}" &>/dev/null; then
            echo "Actualizando release $TAG..."
            gh release upload "$TAG" "$iso_file" "$sha_file" \
              --repo "${{ env.GITHUB_REPO }}" --clobber
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" "$iso_file" "$sha_file" \
              --repo "${{ env.GITHUB_REPO }}" \
              --title "AvalOS ${VERSION}" \
              --notes "$NOTES"
          fi

          echo ""
          echo "Publicado en:"
          echo "https://github.com/${{ env.GITHUB_REPO }}/releases/tag/${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen
        if: always()
        run: |
          echo "## AvalOS ISO Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.vars.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel | ${{ steps.vars.outputs.kernel }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tamano | ${iso_size:-desconocido} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${iso_file:-}" ]]; then
            echo "Publicado en: https://github.com/${{ env.GITHUB_REPO }}/releases/tag/v${{ steps.vars.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
