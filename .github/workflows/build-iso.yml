name: Build AvalOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (vacio = fecha actual YYYY.MM.DD)"
        required: false
        default: ""
      kernel:
        description: "Kernel a usar (linux-avalos / linux-avalos-compat / linux)"
        required: false
        default: "linux-avalos"
      upload:
        description: "Subir ISO a GitHub Releases"
        type: boolean
        default: true

env:
  GITHUB_REPO: jeffreysama/avalos
  AVALOS_REPO_URL: https://github.com/jeffreysama/avalos/releases/download/repo

jobs:
  build-iso:
    name: Construir AvalOS ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Instalar dependencias base
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso \
            git curl wget \
            github-cli \
            python \
            squashfs-tools \
            dosfstools \
            mtools \
            libisoburn \
            erofs-utils

      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar repo [avalos] en pacman
        run: |
          # Inyectar el repo avalos para que mkarchiso pueda descargar linux-avalos
          cat >> /etc/pacman.conf << 'EOF'

          [avalos]
          SigLevel = Optional TrustAll
          Server = https://github.com/jeffreysama/avalos/releases/download/repo
          EOF
          pacman -Sy --noconfirm
          echo "Repo avalos configurado:"
          pacman -Si linux-avalos | grep -E "Name|Version" || echo "[WARN] linux-avalos no disponible aun"

      - name: Determinar version y kernel
        id: vars
        run: |
          # Version
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Intentar desde git tag
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            [[ -z "$VERSION" ]] && VERSION=$(date +%Y.%m.%d)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          # Kernel
          KERNEL="${{ github.event.inputs.kernel }}"
          [[ -z "$KERNEL" ]] && KERNEL="linux-avalos"

          # Verificar disponibilidad del kernel elegido
          if ! pacman -Si "$KERNEL" &>/dev/null; then
            echo "[WARN] $KERNEL no disponible en repos - usando linux como fallback"
            KERNEL="linux"
          fi
          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "Kernel: $KERNEL"

      - name: Preparar perfil archiso
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          KERNEL="${{ steps.vars.outputs.kernel }}"
          BUILD_DIR="/tmp/avalos-iso-build"
          AIROOTFS="$BUILD_DIR/airootfs"

          mkdir -p "$BUILD_DIR"
          cp -r /usr/share/archiso/configs/releng/. "$BUILD_DIR/"

          # profiledef.sh
          cat > "$BUILD_DIR/profiledef.sh" << PROFILEEOF
          #!/usr/bin/env bash
          iso_name="avalos-${VERSION}"
          iso_label="AvalOS_${VERSION//./_}"
          iso_publisher="AvalOS <https://github.com/jeffreysama/avalos>"
          iso_application="AvalOS — Arch-based · Hyprland · Tokyo Night"
          iso_version="${VERSION}"
          install_dir="arch"
          buildmodes=('iso')
          bootmodes=('bios.syslinux' 'uefi.systemd-boot')
          arch="x86_64"
          pacman_conf="pacman.conf"
          airootfs_image_type="squashfs"
          airootfs_image_tool_options=('-comp' 'zstd' '-Xcompression-level' '19' '-b' '1M')
          bootstrap_tarball_compression=('zstd' '-c' '-T0' '--auto-threads=logical' '--long' '-19')
          file_permissions=(
            ["/etc/shadow"]="0:0:400"
            ["/etc/gshadow"]="0:0:400"
            ["/root"]="0:0:750"
            ["/usr/local/bin/avalos-install"]="0:0:755"
            ["/usr/local/bin/avalos-gpu-env"]="0:0:755"
          )
          PROFILEEOF

          # pacman.conf del ISO — incluye repo avalos
          cp /etc/pacman.conf "$BUILD_DIR/pacman.conf"
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' "$BUILD_DIR/pacman.conf"
          # Asegurar que el repo avalos esté en el pacman.conf del ISO
          if ! grep -q '\[avalos\]' "$BUILD_DIR/pacman.conf"; then
            printf '\n[avalos]\nSigLevel = Optional TrustAll\nServer = https://github.com/jeffreysama/avalos/releases/download/repo\n' >> "$BUILD_DIR/pacman.conf"
          fi
          # Sin nvidia
          sed -i '/^[options]/a IgnorePkg = linux-firmware-nvidia' "$BUILD_DIR/pacman.conf"
          # Habilitar multilib para paquetes lib32
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> "$BUILD_DIR/pacman.conf"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "AIROOTFS=$AIROOTFS" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"

      - name: Generar packages.x86_64
        run: |
          KERNEL="${{ steps.vars.outputs.kernel }}"

          cat > "$BUILD_DIR/packages.x86_64" << PKGEOF
          # Kernel
          ${KERNEL}
          linux-firmware-amdgpu
          linux-firmware-radeon
          linux-firmware-intel
          linux-firmware-atheros
          linux-firmware-realtek
          linux-firmware-whence

          # Base
          base
          base-devel
          sudo
          bash
          bash-completion

          # Entorno grafico Hyprland
          hyprland
          hyprpaper
          waybar
          wofi
          kitty
          sddm
          qt5-wayland
          qt6-wayland
          polkit-kde-agent
          xdg-desktop-portal-hyprland
          xdg-desktop-portal-gtk

          # Audio
          pipewire
          pipewire-pulse
          pipewire-alsa
          wireplumber

          # Drivers GPU AMD (primera clase)
          mesa
          vulkan-radeon
          libva-mesa-driver
          lib32-mesa
          lib32-vulkan-radeon

          # Drivers GPU Intel (soporte completo)
          vulkan-intel
          intel-media-driver
          libva-intel-driver
          lib32-vulkan-intel

          # Fuentes y temas
          ttf-jetbrains-mono-nerd
          ttf-nerd-fonts-symbols
          noto-fonts
          noto-fonts-emoji

          # Herramientas live
          networkmanager
          nm-connection-editor
          git
          curl
          wget
          python
          python-pip
          python-pywebview
          fastfetch
          htop
          nano
          vim
          grim
          slurp
          wl-clipboard
          xdg-utils
          udisks2
          udiskie
          gvfs
          thunar
          file-roller
          firefox

          # Herramientas de instalacion
          arch-install-scripts
          parted
          dosfstools
          e2fsprogs
          btrfs-progs
          gptfdisk

          # archiso (para el live)
          archiso
          syslinux
          edk2-shell
          PKGEOF

          echo "packages.x86_64 generado"
          wc -l "$BUILD_DIR/packages.x86_64"

      - name: Configurar airootfs (scripts, configs, wallpaper)
        run: |
          mkdir -p "$AIROOTFS/usr/local/bin"
          mkdir -p "$AIROOTFS/root/.config/hypr"
          mkdir -p "$AIROOTFS/root/.config/waybar"
          mkdir -p "$AIROOTFS/root/.config/kitty"
          mkdir -p "$AIROOTFS/root/.config/hypr"
          mkdir -p "$AIROOTFS/etc/sddm.conf.d"
          mkdir -p "$AIROOTFS/etc/systemd/system/graphical.target.wants"
          mkdir -p "$AIROOTFS/etc/pacman.d"

          # mirrorlist dentro del airootfs (requerido por mkarchiso al crear lista de paquetes)
          cp /etc/pacman.d/mirrorlist "$AIROOTFS/etc/pacman.d/mirrorlist" 2>/dev/null || \
            echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' \
              > "$AIROOTFS/etc/pacman.d/mirrorlist"

          # pacman.conf dentro del airootfs
          cp "$BUILD_DIR/pacman.conf" "$AIROOTFS/etc/pacman.conf"

          # Copiar instalador si existe en el repo
          if [[ -f "skill_instalar_usb.py" ]]; then
            cp skill_instalar_usb.py "$AIROOTFS/usr/local/bin/avalos-install"
            chmod 755 "$AIROOTFS/usr/local/bin/avalos-install"
            echo "Instalador copiado"
          else
            echo "[WARN] skill_instalar_usb.py no encontrado — live sin instalador grafico"
          fi

          # avalos-gpu-env
          cat > "$AIROOTFS/usr/local/bin/avalos-gpu-env" << 'GPUEOF'
          #!/bin/bash
          HYPR_CFG="$HOME/.config/hypr/gpu-env.conf"
          mkdir -p "$(dirname "$HYPR_CFG")"
          if lspci 2>/dev/null | grep -qiE 'amd|radeon|amdgpu'; then
              printf 'env = AMD_VULKAN_ICD,RADV\nenv = VDPAU_DRIVER,radeonsi\nenv = LIBVA_DRIVER_NAME,radeonsi\n' > "$HYPR_CFG"
          elif lspci 2>/dev/null | grep -qiE 'intel.*(graphics|vga|display)'; then
              printf 'env = LIBVA_DRIVER_NAME,iHD\nenv = VDPAU_DRIVER,va_gl\n' > "$HYPR_CFG"
          else
              : > "$HYPR_CFG"
          fi
          GPUEOF
          chmod 755 "$AIROOTFS/usr/local/bin/avalos-gpu-env"

          # gpu-detect service (corre antes de SDDM)
          cat > "$AIROOTFS/etc/systemd/system/avalos-gpu-detect.service" << 'SVCEOF'
          [Unit]
          Description=AvalOS GPU Environment Detection
          Before=sddm.service display-manager.service
          After=systemd-udev-settle.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/avalos-gpu-env
          RemainAfterExit=yes

          [Install]
          WantedBy=graphical.target
          SVCEOF
          ln -sf /etc/systemd/system/avalos-gpu-detect.service \
              "$AIROOTFS/etc/systemd/system/graphical.target.wants/avalos-gpu-detect.service"

          # SDDM autologin root en live
          cat > "$AIROOTFS/etc/sddm.conf.d/autologin.conf" << 'SDDMEOF'
          [Autologin]
          User=root
          Session=hyprland
          SDDMEOF

          # Wallpaper Tokyo Night PNG puro (sin dependencias)
          python3 - "$AIROOTFS/root/.config/hypr/wallpaper.png" << 'PYPNG'
          import sys, struct, zlib
          path = sys.argv[1]
          def chunk(t, d):
              crc = zlib.crc32(t + d) & 0xffffffff
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', crc)
          w, h, R, G, B = 1920, 1080, 26, 27, 38
          rows = (b'\x00' + bytes([R, G, B]) * w) * h
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(rows, 9))
                 + chunk(b'IEND', b''))
          open(path, 'wb').write(png)
          PYPNG

          # hyprpaper.conf
          cat > "$AIROOTFS/root/.config/hypr/hyprpaper.conf" << 'HYPRPAPEREOF'
          preload = ~/.config/hypr/wallpaper.png
          wallpaper = ,~/.config/hypr/wallpaper.png
          splash = false
          HYPRPAPEREOF

          # gpu-env.conf vacio (se sobreescribe por el servicio antes de Hyprland)
          touch "$AIROOTFS/root/.config/hypr/gpu-env.conf"

          # hyprland.conf del live
          cat > "$AIROOTFS/root/.config/hypr/hyprland.conf" << 'HYPREOF'
          # AvalOS Live — Hyprland config
          source = ~/.config/hypr/gpu-env.conf

          monitor = ,preferred,auto,1

          exec-once = /usr/local/bin/avalos-gpu-env
          exec-once = hyprpaper
          exec-once = waybar
          exec-once = python /usr/local/bin/avalos-install

          general {
              gaps_in = 4
              gaps_out = 8
              border_size = 2
              col.active_border = rgba(7aa2f7ff)
              col.inactive_border = rgba(1a1b26ff)
          }

          decoration {
              rounding = 8
              blur { enabled = true; size = 6; passes = 3 }
          }

          input {
              kb_layout = latam
              follow_mouse = 1
              touchpad { natural_scroll = true }
          }

          bind = SUPER, Return, exec, kitty
          bind = SUPER, Q, killactive
          bind = SUPER, Space, exec, wofi --show drun
          bind = SUPER SHIFT, E, exit
          HYPREOF

          # kitty.conf minimal
          cat > "$AIROOTFS/root/.config/kitty/kitty.conf" << 'KITTYEOF'
          font_family JetBrainsMono Nerd Font
          font_size 12.0
          background #1a1b26
          foreground #c0caf5
          KITTYEOF

          # sysctl BBR
          mkdir -p "$AIROOTFS/etc/sysctl.d"
          cat > "$AIROOTFS/etc/sysctl.d/80-avalos-bbr.conf" << 'BBREOF'
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          BBREOF

          echo "airootfs configurado"

      - name: Construir ISO con mkarchiso
        run: |
          BUILD_WORK="/tmp/avalos-iso-work"
          OUTPUT_DIR="/tmp/avalos-iso-output"
          mkdir -p "$BUILD_WORK" "$OUTPUT_DIR"

          echo "Iniciando mkarchiso..."
          mkarchiso -v -w "$BUILD_WORK" -o "$OUTPUT_DIR" "$BUILD_DIR"

          ISO_FILE=$(find "$OUTPUT_DIR" -name "*.iso" | head -1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "ERROR: ISO no generada"
            exit 1
          fi

          ISO_SIZE=$(du -sh "$ISO_FILE" | cut -f1)
          echo "ISO generada: $ISO_FILE ($ISO_SIZE)"
          echo "iso_file=$ISO_FILE" >> "$GITHUB_ENV"
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_ENV"

          # SHA256
          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          echo "sha_file=${ISO_FILE}.sha256" >> "$GITHUB_ENV"

      - name: Publicar en GitHub Releases
        if: github.event.inputs.upload != 'false'
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="v${VERSION}"

          NOTES="## AvalOS ${VERSION}

          **Kernel:** ${{ steps.vars.outputs.kernel }}
          **Base:** Arch Linux (rolling)
          **Entorno:** Hyprland · Wayland · Tokyo Night

          ### Instalacion rapida
          1. Descarga la ISO
          2. Grabala en un USB con Ventoy o \`dd\`
          3. Arranca desde el USB
          4. El instalador grafico abre automaticamente
          5. Elige disco, usuario, contrasena, timezone → Instalar
          6. Reinicia sin el USB

          ### Checksums
          \`\`\`
          $(cat "$sha_file")
          \`\`\`"

          if gh release view "$TAG" --repo "${{ env.GITHUB_REPO }}" &>/dev/null; then
            echo "Actualizando release $TAG..."
            gh release upload "$TAG" "$iso_file" "$sha_file" \
              --repo "${{ env.GITHUB_REPO }}" --clobber
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" "$iso_file" "$sha_file" \
              --repo "${{ env.GITHUB_REPO }}" \
              --title "AvalOS ${VERSION}" \
              --notes "$NOTES"
          fi

          echo ""
          echo "Publicado en:"
          echo "https://github.com/${{ env.GITHUB_REPO }}/releases/tag/${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen
        if: always()
        run: |
          echo "## AvalOS ISO Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.vars.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel | ${{ steps.vars.outputs.kernel }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tamano | ${iso_size:-desconocido} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${iso_file:-}" ]]; then
            echo "Publicado en: https://github.com/${{ env.GITHUB_REPO }}/releases/tag/v${{ steps.vars.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
