<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#1a1b26"/>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)" opacity="0.92"/>
  <!-- tres controles deslizantes: ajustar varias cosas desde un solo lugar -->
  <g stroke="#1a1b26" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="32" x2="76" y2="32"/>
    <line x1="24" y1="50" x2="76" y2="50"/>
    <line x1="24" y1="68" x2="76" y2="68"/>
  </g>
  <g fill="#1a1b26" stroke="url(#bg)" stroke-width="3">
    <circle cx="58" cy="32" r="8.5"/>
    <circle cx="38" cy="50" r="8.5"/>
    <circle cx="64" cy="68" r="8.5"/>
  </g>
