# ── AvalOS — hyprlock.conf ────────────────────────────────────────

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    # BUG-1 FIX: propiedades en una sola línea separadas por punto y coma.
    # hyprlock no soporta múltiples propiedades en la misma línea con ";".
    # Cada propiedad debe estar en su propia línea o hyprlock las ignora
    # silenciosamente y usa los valores por defecto (sin blur, sin oscurecer).
    blur_size = 5
    blur_passes = 3
    brightness = 0.65
    # noise = 0.02 descomenta para añadir grano sutil sobre el blur
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    # BUG-2 FIX: colores en una sola línea con ";".
    # Mismo problema que en background — cada propiedad en su propia línea.
    outer_color = rgb(7aa2f7)
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    # BUG-3 FIX: check_color ausente.
    # Sin check_color, cuando la contraseña es correcta el campo no cambia
    # de color y el usuario no sabe si fue aceptada hasta que la pantalla
    # se desbloquea (puede parecer que falló).
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    fail_text = <span foreground="#f7768e">$FAIL ($ATTEMPTS)</span>
    placeholder_text = <span foreground="#565f89">Password…</span>
    # BUG-4 FIX: position y halign/valign en una sola línea con ";".
    # hyprlock ignora todo lo que sigue al primer ";" en una línea de config.
    position = 0, -80
    halign = center
    valign = center
    # capslock_color hace visible cuando Caps Lock está activo
    capslock_color = rgb(e0af68)
}

# Reloj — hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(187, 154, 247, 1.0)
    # BUG-5 FIX: font_size y font_family en una sola línea con ";".
    font_size = 70
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    # BUG-6 FIX: fecha hardcodeada en español ("de %B").
    # date +"%A, %d de %B" siempre produce texto en español independientemente
    # del locale del sistema. Si el usuario instaló AvalOS en inglés o chino,
    # la fecha del lock screen aparece en español de todas formas.
    #
    # BUG-6b FIX: el fallback de la primera versión de este fix nunca se
    # ejecutaba. `LC_TIME=$(locale | grep ^LC_TIME | cut -d= -f2 | tr -d '"'
    # || echo en_US.UTF-8)` evalúa el "||" sobre el código de salida del
    # PIPE completo, que es el de tr (el último comando) — y tr sale con
    # éxito (0) incluso con entrada vacía. El "|| echo en_US.UTF-8" jamás
    # se alcanza, sin importar si locale/grep encuentran algo o no.
    # Con expansión de parámetros de shell (${VAR:-default}) sí se evalúa
    # "está vacía o sin definir la variable", que es la pregunta correcta.
    text = cmd[update:60000] LC_TIME="${LC_TIME:-${LANG:-en_US.UTF-8}}" date "+%A, %d %B %Y"
    color = rgba(122, 162, 247, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# BUG-7 FIX: label de hostname ausente.
# Es buena práctica mostrar el hostname en la pantalla de bloqueo para
# distinguir entre máquinas cuando se tiene más de una (trabajo/casa).
label {
    monitor =
    text = cmd[update:3600000] echo " $(hostname)"
    color = rgba(86, 95, 137, 0.7)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}
