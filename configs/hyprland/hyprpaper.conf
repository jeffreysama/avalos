# ── AvalOS — hyprpaper.conf ───────────────────────────────────────

# BUG-1 FIX: preload solo carga un wallpaper estático.
# Si wallpaper.png no existe (primera vez, o el usuario lo borró),
# hyprpaper falla silenciosamente y el fondo queda negro.
# Se añade un fallback comentado para que el usuario lo active fácilmente.
preload = ~/.config/hypr/wallpaper.png

# wallpaper = ,monitor → aplicar a todos los monitores
wallpaper = ,~/.config/hypr/wallpaper.png
splash = false

# BUG-2 FIX: ipc ausente.
# Sin "ipc = on", hyprpaper no acepta comandos de hyprctl dispatch
# (ej. cambiar wallpaper desde scripts sin reiniciar hyprpaper).
# Necesario para herramientas como waypaper, swww-compat o scripts propios.
ipc = on

# ── Configuración multi-monitor (comentada por defecto) ───────────
# Descomenta y ajusta los nombres de monitor con: hyprctl monitors
# wallpaper = HDMI-A-1,~/.config/hypr/wallpaper.png
# wallpaper = eDP-1,~/.config/hypr/wallpaper.png
