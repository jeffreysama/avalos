# ── AvalOS — hyprpaper.conf ───────────────────────────────────────

# BUG-14 FIX: sintaxis de "preload = ...\nwallpaper = ,...\n" retirada.
# hyprpaper se reescribió sobre hyprtoolkit (dic-2025/ene-2026) — el README
# oficial del proyecto dice ahora "fill, tile, cover or contain modes", y
# preload ya no existe como directiva (confirmado en issues #292 y #314 del
# repo, y en wiki.hypr.land). Con la sintaxis vieja hyprpaper tira error de
# config ("config option <wallpaper:monitor> does not exist") y ningún
# monitor recibe wallpaper. La sintaxis actual usa un bloque wallpaper{}
# con fit_mode incluido — ya no hace falta preload por separado.
#
# monitor vacío = aplica a todos los monitores que no tengan uno propio.
# fit_mode: cover (default, recorta para llenar) | contain (sin recortar,
# puede dejar barras) | fill (estira, ignora aspect ratio) | tile (repite).
# avalos-wallpaper reescribe este bloque completo al cambiar de fondo.
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    fit_mode = cover
}

splash = false

# ipc está habilitado por defecto (ConfigManager.cpp: addConfigValue("ipc", INT{1})).
# La línea de abajo es redundante pero se mantiene explícita para dejar claro
# que este proceso acepta comandos hyprctl hyprpaper en runtime
# (ej. cambiar wallpaper desde scripts sin reiniciar hyprpaper).
# Para deshabilitarlo: ipc = off
ipc = on

# ── Configuración multi-monitor (comentada por defecto) ───────────
# Descomenta y ajusta los nombres de monitor con: hyprctl monitors
# wallpaper {
#     monitor = HDMI-A-1
#     path = ~/.config/hypr/wallpaper.png
#     fit_mode = cover
# }
# wallpaper {
