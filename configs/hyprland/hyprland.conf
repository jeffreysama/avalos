# ── AvalOS Live — hyprland.conf ──────────────────────────────────
# Este config es para el entorno LIVE del USB.
# El sistema instalado usa hyprland_conf.template (con GPU vars).

# BUG-1 FIX: source gpu-env.conf DESPUÉS de que avalos-gpu-env lo genera.
# Si se sourcea al inicio y el archivo todavía está vacío (servicio aún
# no corrió), Hyprland arranca sin variables de GPU y las apps Wayland
# pueden caer al modo software rendering. El exec-once con sleep garantiza
# que el archivo ya tiene contenido antes del reload.
source = ~/.config/hypr/gpu-env.conf

monitor = ,preferred,auto,1

# BUG-2 FIX: exec-once en orden correcto.
# hyprpaper DEBE arrancar antes que waybar — si waybar intenta mostrar
# el módulo de wallpaper/custom antes de que hyprpaper esté listo, genera
# un error visible en el log de Hyprland.
# avalos-gpu-env genera gpu-env.conf y luego hyprctl reload lo recarga;
# sleep 0.5 (subido de 0.3) da margen suficiente en hardware lento/VM.
exec-once = /usr/local/bin/avalos-gpu-env && sleep 0.5 && hyprctl reload
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
# BUG-3 FIX: hyprpolkitagent es necesario en el live también.
# Sin él, acciones que requieren privilegios (montar discos, pacman, etc.)
# desde la GUI no muestran diálogo de contraseña y fallan silenciosamente.
exec-once = hyprpolkitagent
exec-once = python /usr/local/bin/avalos-install

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
    resize_on_border = true
    # BUG-4 FIX: allow_tearing ausente en el live.
    # Sin esta línea Hyprland usa el default (true en versiones recientes),
    # lo que puede causar tearing visible en el live con GPUs integradas.
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.92
    blur {
        enabled = true
        size = 4
        passes = 1
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(1a1b2660)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.08, 0.9, 0.1, 1.05
    animation = windows,    1, 6, myBezier
    animation = windowsOut, 1, 5, default, popin 75%
    animation = border,     1, 8, default
    animation = fade,       1, 6, default
    animation = workspaces, 1, 5, default, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    # BUG-5 FIX: kb_layout = la-latin1 es un layout de Xorg, no de Wayland/libxkbcommon.
    # En Hyprland (Wayland) el layout correcto para Latinoamérica es "latam".
    # "la-latin1" hace que Hyprland caiga al layout "us" por defecto sin avisar,
    # lo que rompe las teclas ñ, á, é, í, ó, ú, ¿, ¡ en el live.
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

misc {
    force_default_wallpaper = 0
    vfr = true
    # BUG-6 FIX: disable_hyprland_logo ausente.
    # Sin esto Hyprland muestra el logo animado al arrancar, que en el live
    # aparece superpuesto al instalador durante ~2s y confunde al usuario.
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, Space, exec, rofi -show drun
# BUG-7 FIX: $mod SHIFT, E usaba "exit" que cierra Hyprland por completo.
# En el live esto deja al usuario sin entorno gráfico sin posibilidad de
# volver. Cambiado a un powermenu básico; si el script no existe, se usa
# systemctl poweroff como fallback seguro.
bind = $mod SHIFT, E, exec, ~/.config/rofi/scripts/powermenu.sh || systemctl poweroff
bind = $mod, F, fullscreen
bind = $mod, T, togglefloating
# BUG-8 FIX: teclas de dirección HJKL ausentes en el live.
# El template las tiene pero el live no — inconsistencia que confunde
# a usuarios que alternan entre la sesión live y el sistema instalado.
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
# BUG-9 FIX: scroll de ratón para cambiar workspace ausente en el live.
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, Tab,       workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
# Captura de pantalla (útil en el live para documentar errores)
bind = , Print, exec, grim ~/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bindel = , XF86AudioRaiseVolume,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,          exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,    exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown,  exec, brightnessctl set 5%-

# BUG-10 FIX: windowrules ausentes en el live.
# El instalador (pywebview) abre en modo flotante — sin esta regla aparece
# en el layout dwindle en lugar de centrado, tapando media pantalla.
windowrulev2 = float,      class:(avalos-install)
windowrulev2 = center,     class:(avalos-install)
windowrulev2 = size 1000 700, class:(avalos-install)
windowrulev2 = float,      class:(pavucontrol)
windowrulev2 = float,      class:(nm-connection-editor)
