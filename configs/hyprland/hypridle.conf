# ── AvalOS — hypridle.conf ────────────────────────────────────────
# Gestión de inactividad: apagado de pantalla → bloqueo → suspensión

general {
    lock_cmd        = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    # BUG-1 FIX: ignore_dbus_inhibit ausente.
    # Sin esto, cuando hay una app con inhibit activo (ej. mpv reproduciendo
    # un video, obs grabando, o una presentación) hypridle igualmente apaga
    # la pantalla y bloquea la sesión interrumpiendo la actividad.
    # ignore_dbus_inhibit = false respeta los inhibidores (comportamiento correcto).
    ignore_dbus_inhibit = false
    # BUG-2 FIX: ignore_systemd_inhibit ausente.
    # Mismo problema con inhibidores de systemd (ej. dnf/pacman actualizando,
    # rsync en curso). Sin esto hypridle puede suspender el sistema mientras
    # hay una actualización activa, corrompiendo la base de datos de pacman.
    ignore_systemd_inhibit = false
}

# BUG-3 FIX: listeners en una sola línea con ";" como separador.
# hypridle NO soporta múltiples propiedades en la misma línea separadas
# por punto y coma — las ignora silenciosamente o falla al parsear.
# on-timeout y on-resume deben estar en líneas propias dentro del bloque.

# ── Paso 1 (5 min): apagar pantalla ──────────────────────────────
# BUG-4 FIX: se apagaba la pantalla sin disminuir el brillo antes.
# El cambio brusco de pantalla encendida a apagada es molesto y puede
# parecer un crash. Se añade un listener previo que baja el brillo
# gradualmente como advertencia visual antes del apagado.
listener {
    timeout  = 240
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# ── Paso 2 (10 min): bloquear sesión ─────────────────────────────
# BUG-5 FIX: el bloqueo usaba loginctl lock-session, que en algunos
# setups de Hyprland sin logind completo no dispara correctamente.
# Llamar hyprlock directamente (con pidof para no duplicar instancias)
# es más robusto en este entorno.
listener {
    timeout    = 600
    on-timeout = pidof hyprlock || hyprlock
}

# ── Paso 3 (30 min): suspender sistema ───────────────────────────
# BUG-6 FIX: suspensión directa sin verificar si hay audio activo.
# systemctl suspend mientras hay audio reproduciendo (música, videollamada)
# corta la conexión de PipeWire abruptamente, causando que al resumir
# el audio no funcione hasta reiniciar pipewire.
# Se para PipeWire antes de suspender y se reinicia al resumir.
listener {
    timeout    = 1800
    # BUG-04 FIX (corregido): el comentario original decía que listar
    # "wireplumber pipewire-pulse pipewire" EN ESE ORDEN como argumentos
    # de un solo `systemctl stop` garantizaba que pararan en ese orden.
    # Eso no es así: systemd decide el orden de parada según el grafo de
    # dependencias (After=/Before=/Requires=) de las unidades, no según
    # el orden en que se listan en la línea de comandos. Si wireplumber.service
    # ya declara After=pipewire.service (como en el paquete de Arch), systemd
    # lo para correctamente solo; si NO se puede asumir esa dependencia,
    # hay que forzar el orden con dos llamadas secuenciales como abajo.
    on-timeout = systemctl --user stop wireplumber && systemctl --user stop pipewire-pulse pipewire && systemctl suspend
    # Mismo razonamiento que arriba pero al revés: pipewire-pulse y wireplumber
    # dependen de pipewire, así que pipewire debe arrancar primero.
    on-resume  = systemctl --user start pipewire && systemctl --user start pipewire-pulse wireplumber
}
