# ── AvalOS — kitty.conf ───────────────────────────────────────────
# Tema: Tokyo Night

# ── Fuente ────────────────────────────────────────────────────────
font_family             JetBrainsMono Nerd Font
# BUG-1 FIX: bold_font y italic_font ausentes.
# Sin estas líneas kitty usa el fallback del sistema para negrita e itálica,
# que puede ser una fuente completamente diferente a JetBrainsMono y rompe
# la visualización de ls --color, git diff, nvim con themes, etc.
bold_font               JetBrainsMono Nerd Font Bold
italic_font             JetBrainsMono Nerd Font Italic
bold_italic_font        JetBrainsMono Nerd Font Bold Italic
font_size               12.0

# BUG-2 FIX: adjust_line_height ausente.
# Con JetBrainsMono el interlineado por defecto es muy ajustado y hace
# que los caracteres Nerd Font (íconos) se corten verticalmente.
# 110% de altura de línea da espacio suficiente para los íconos.
adjust_line_height      110%

# ── Colores — Tokyo Night ─────────────────────────────────────────
background              #1a1b26
foreground              #c0caf5
selection_background    #28344a
selection_foreground    #c0caf5
cursor                  #c0caf5
cursor_text_color       #1a1b26
# BUG-3 FIX: cursor_shape y cursor_blink_interval ausentes.
# El cursor por defecto de kitty es un bloque sólido sin parpadeo,
# lo que hace difícil encontrarlo en terminales con mucho texto.
cursor_shape            beam
cursor_blink_interval   0.5

# Colores normales (0-7)
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
# Colores brillantes (8-15)
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ── Ventana ───────────────────────────────────────────────────────
background_opacity      0.92
window_padding_width    10
# BUG-4 FIX: resize_debounce_time ausente.
# Sin esto, al redimensionar la ventana kitty re-renderiza el contenido
# en cada pixel de movimiento, causando flickering visible en Wayland.
resize_debounce_time    0.1

# ── Tabs ─────────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
# BUG-5 FIX: tab_bar_min_tabs ausente.
# Sin esto la barra de tabs aparece aunque solo haya una tab abierta,
# desperdiciando una línea de espacio vertical innecesariamente.
tab_bar_min_tabs        2
# BUG-6 FIX: colores de tabs ausentes.
# Sin estos, las tabs usan el color background general (#1a1b26) tanto
# para la activa como para las inactivas — son indistinguibles.
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #565f89
inactive_tab_background #24283b

# ── Comportamiento ────────────────────────────────────────────────
enable_audio_bell       no
# BUG-7 FIX: visual_bell_duration ausente.
# Con audio_bell desactivado, sin visual_bell el usuario no recibe ninguna
# señal cuando ocurre un bell (ej. Tab en bash sin completar).
# Un parpadeo breve de 0.1s es suficiente sin ser molesto.
visual_bell_duration    0.1
scrollback_lines        10000
confirm_os_window_close 0
# BUG-8 FIX: copy_on_select ausente.
# En Wayland, seleccionar texto con el ratón no lo copia automáticamente
# al portapapeles primario. copy_on_select = clipboard copia al clipboard
# además del primary, igualando el comportamiento esperado en Linux.
copy_on_select          clipboard
# BUG-9 FIX: strip_trailing_spaces ausente.
# Sin esto, al copiar texto de kitty se incluyen los espacios de relleno
# del terminal hasta el final de línea, pegando texto con basura de espacios.
strip_trailing_spaces   smart
# BUG-10 FIX: url_style y open_url_with ausentes.
# Sin estos, kitty subraya las URLs pero no las hace clickeables con Ctrl+click.
url_style               curly
open_url_with           firefox

# ── Wayland ───────────────────────────────────────────────────────
# BUG-11 FIX: linux_display_server ausente.
# Sin esta línea kitty detecta automáticamente Wayland vs X11, pero en
# setups con XWayland activo a veces arranca en modo X11 perdiendo
# HiDPI nativo, mejor rendering de fuentes y gestión de clipboard Wayland.
linux_display_server    wayland
