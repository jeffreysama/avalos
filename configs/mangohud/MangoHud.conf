# AvalOS — MangoHUD config (Tokyo Night)
# Actívalo en cualquier juego con: MANGOHUD=1 %command%
# O en Steam: agrega "MANGOHUD=1 %command%" en opciones de lanzamiento

legacy_layout=0
position=top-left
width=260
# BUG-1 FIX: height=150 hardcodeado puede cortar contenido si se activan
# más módulos (ej. wine + engine_version + vram). height=0 = automático.
height=0

# ── Qué mostrar ────────────────────────────────────────────────────
fps
# BUG-2 FIX: fps_limit=0 desactiva el limitador — correcto para gaming,
# pero sin comentario puede confundir. Se documenta el uso.
fps_limit=0
frame_timing=1
frametime
cpu_stats
cpu_temp
gpu_stats
gpu_temp
gpu_power
vram
ram
# BUG-3 FIX: "wine" solo muestra info si el juego corre bajo Wine/Proton.
# En juegos nativos de Linux este campo queda vacío y ocupa espacio.
# Se deja pero documentado para que el usuario sepa que es condicional.
wine
engine_version
# BUG-4 FIX: módulos de red y tiempo de sistema ausentes — útiles para
# gaming (ping en juegos online, tiempo jugado).
# Comentados por defecto para no saturar el HUD; descomentar según preferencia.
# network
# time

# ── Aspecto — Tokyo Night ──────────────────────────────────────────
background_alpha=0.7
font_size=20
font_size_text=16
# BUG-5 FIX: colores sin prefijo "#" — MangoHUD acepta hex sin "#" pero
# es una fuente de confusión al copiar/pegar desde otras herramientas.
# Se dejan sin "#" que es el formato nativo correcto de MangoHUD.
text_color=c0caf5
background_color=1a1b26
gpu_color=7aa2f7
cpu_color=9ece6a
# BUG-6 FIX: color de VRAM y RAM ausentes — sin estos usan el color por
# defecto de MangoHUD (blanco) que rompe el tema Tokyo Night.
vram_color=bb9af7
ram_color=9ece6a
# BUG-7 FIX: wine_color ausente — sin esto el texto de Wine/Proton
# aparece en blanco rompiendo el tema.
wine_color=7dcfff

fps_color_change=1
fps_value=30,60
fps_color=f7768e,e0af68,9ece6a

# BUG-8 FIX: frametime_color ausente — la barra de frametime usaba
# el color por defecto (blanco) en lugar del Tokyo Night verde.
frametime_color=9ece6a

# ── Comportamiento ─────────────────────────────────────────────────
no_display=0
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_R+F1
reload_cfg=Shift_R+F4
upload_log=Shift_R+F3
# BUG-9 FIX: toggle_logging ausente — sin esto no hay forma de iniciar
# y detener el log de rendimiento desde el teclado durante el juego.
toggle_logging=Shift_R+F2
# BUG-10 FIX: output_folder ausente — sin esto los logs de MangoHUD
# se guardan en el directorio de trabajo actual del juego (a veces
# dentro de ~/.steam o directorios de solo lectura) en lugar de un
# lugar predecible y accesible.
output_folder=~/.local/share/MangoHud/logs  # WARN-04 FIX: ~ es expandido por MangoHud; $USER puede no estar en el env de algunos lanzadores
